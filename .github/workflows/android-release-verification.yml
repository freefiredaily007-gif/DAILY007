name: Android release verification

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-release-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview-entrypoints:
    name: Daily007 browser preview smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install Chromium
        id: chromium
        uses: browser-actions/setup-chrome@v1
        with:
          install-dependencies: true

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Daily007 preview smoke test
        env:
          CHROMIUM_PATH: ${{ steps.chromium.outputs.chrome-path }}
        run: pnpm --filter @workspace/mockup-sandbox run test:preview-entrypoints

  tournament-join-recovery:
    name: Tournament join recovery (Android emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Keep this Expo Go release aligned with the Expo SDK in daily007/package.json.
      EXPO_GO_VERSION: 57.0.9
      MAESTRO_VERSION: 2.7.0

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Set up Java for Maestro
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify emulator script process lifetime and failure diagnostics
        run: node --test .github/scripts/android-emulator-verification.test.mjs

      - name: Run join recovery regression tests
        run: pnpm --filter @workspace/daily007 run test:tournament-join-recovery

      - name: Run JoinForm accessibility label regression tests
        run: pnpm --filter @workspace/daily007 run test:join-form

      - name: Verify Home-to-match native Back test wiring
        run: pnpm --filter @workspace/daily007 run test:home-match-back-fixture

      - name: Run Wallet refund accessibility regression tests
        run: pnpm --filter @workspace/daily007 run test:wallet-cancellation-history

      - name: Verify native leaderboard text-scale test coverage
        run: pnpm --filter @workspace/daily007 run test:leaderboard-native-text-scale

      - name: Verify native leaderboard tab test coverage
        run: pnpm --filter @workspace/daily007 run test:leaderboard-tabs-emulator-coverage

      - name: Verify saved-session recovery test coverage
        run: |
          pnpm --filter @workspace/daily007 run test:session-verification
          pnpm --filter @workspace/daily007 run test:session-verification-native

      - name: Verify Expo Go matches the app SDK
        run: |
          node <<'NODE'
          const appPackage = require("./artifacts/daily007/package.json");
          const expoVersion = appPackage.devDependencies?.expo ?? appPackage.dependencies?.expo;
          const sdkMajor = expoVersion?.match(/\d+/)?.[0];
          const expoGoMajor = process.env.EXPO_GO_VERSION?.split(".")[0];
          if (!sdkMajor || sdkMajor !== expoGoMajor) {
            console.error(`Expo Go ${process.env.EXPO_GO_VERSION} does not match app Expo SDK ${expoVersion}.`);
            process.exit(1);
          }
          console.log(`Expo Go ${process.env.EXPO_GO_VERSION} matches Expo SDK ${sdkMajor}.`);
          NODE

      - name: Download Expo Go for Android emulator
        run: |
          curl --fail --location --retry 3 \
            "https://github.com/expo/expo-go-releases/releases/download/Expo-Go-${EXPO_GO_VERSION}/Expo-Go-${EXPO_GO_VERSION}.apk" \
            --output "$RUNNER_TEMP/expo-go.apk"

      - name: Install Maestro CLI
        run: |
          export MAESTRO_VERSION
          curl --fail --silent --show-error --location https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.maestro/bin:$PATH"
          maestro --version

      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Prepare Android emulator diagnostics
        run: mkdir -p android-emulator-diagnostics

      - name: Run Maestro flows on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          # The action executes each input line in a new sh process.
          script: bash .github/scripts/android-emulator-verification.sh 35

      - name: Run JoinForm accessibility labels on Android 16 (API 36)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: bash .github/scripts/android-emulator-verification.sh 36

      - name: Upload Android emulator diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-emulator-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: android-emulator-diagnostics/
          if-no-files-found: warn
          retention-days: 3
