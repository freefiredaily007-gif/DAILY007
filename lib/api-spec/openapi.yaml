openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: |
    API specification. Daily007 v2 owns fresh accounts, wallets, and
    transactional game registration under /daily007/v2. The mobile client
    also uses Replit-backed compatibility routes under /auth, /tournaments,
    /wallet, /payments, /withdrawals, and /admin. Old unpublished hosted
    accounts and balances are intentionally not imported. The daily007_v2_*
    PostgreSQL schema is defined in lib/db/src/schema and is applied to
    development through the standard Drizzle push; managed production
    schema changes follow Replit Publish. Authentication uses
    DAILY007_AUTH_SECRET when configured, otherwise SESSION_SECRET
    (at least 32 characters). First-admin onboarding requires a
    separate DAILY007_ADMIN_BOOTSTRAP_TOKEN (at least 32 random characters).
    Admin onboarding: create a normal account, call POST
    /daily007/v2/admin/bootstrap with that account's bearer token and the
    configured bootstrapToken, then remove the bootstrap secret. There is no
    default or auto-created administrator. Mobile clients must use this
    project's /api path and pass bearer tokens; the current mobile client
    now uses a fresh Replit session rather than the former hosted API.
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /daily007/v2/auth/register:
    post:
      operationId: daily007V2RegisterAccount
      summary: Create an isolated Daily007 v2 account
      description: Passwords are stored as salted scrypt hashes. New accounts are users with a zero-coin wallet.
      responses:
        "201": { description: Account created; returns bearer token and account }
        "400": { description: Invalid input }
        "409": { description: Email already exists }
  /daily007/v2/auth/login:
    post:
      operationId: daily007V2Login
      summary: Authenticate a Daily007 v2 account
      responses:
        "200": { description: Bearer token and account }
        "401": { description: Invalid credentials }
  /daily007/v2/auth/me:
    get:
      operationId: daily007V2Me
      summary: Get authenticated account and wallet balance
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Account }
        "401": { description: Missing or invalid bearer token }
  /daily007/v2/admin/bootstrap:
    post:
      operationId: daily007V2BootstrapAdmin
      summary: Promote the authenticated account to the first administrator
      description: Requires configured bootstrap secret. Succeeds only while no v2 administrator exists.
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: First administrator created }
        "403": { description: Invalid bootstrap secret }
        "409": { description: Admin setup already completed }
  /daily007/v2/matches:
    get:
      operationId: daily007V2ListMatches
      summary: List match capacities, entry prices, and status
      responses:
        "200": { description: Match list; does not expose room credentials }
  /daily007/v2/admin/matches:
    post:
      operationId: daily007V2CreateMatch
      summary: Create a match
      description: Admin only. Capacities are fixed to solo=48 registrations, squad=12 teams, and clash=2 teams. startsAt must be a future ISO timestamp; entryCoins must be a nonnegative integer.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Daily007V2CreateMatchBody" }
      responses:
        "201": { description: Match created }
        "400": { description: Invalid input }
        "403": { description: Administrator required }
  /daily007/v2/admin/matches/{id}:
    patch:
      operationId: daily007V2ConfigureMatch
      summary: Configure a match entry price
      description: Admin only; body may update entryCoins (a nonnegative integer), startsAt (a future ISO timestamp), or both.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Daily007V2UpdateMatchBody" }
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Updated match }
        "400": { description: Invalid input }
        "404": { description: Match not found }
  /daily007/v2/matches/{id}/register:
    post:
      operationId: daily007V2RegisterMatch
      summary: Register the authenticated account for a match
      description: Requires captainName and a nonempty captainGameUid (game identity, distinct from account ID). Team modes require exactly three teammate objects with a nonempty name; uid is optional. The authenticated account is always the captain. Capacity and wallet debit are transactional. A repeated registration returns the original receipt without another debit.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Daily007V2RegistrationBody" }
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "201": { description: Registration and post-debit wallet balance }
        "200": { description: Existing registration receipt returned idempotently; no additional debit }
        "400": { description: Invalid input }
        "409": { description: "Full match, or insufficient wallet balance" }
  /daily007/v2/admin/users/{id}/wallet:
    post:
      operationId: daily007V2CreditWallet
      summary: Credit a user's wallet with an audited ledger entry
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Updated wallet balance }
        "400": { description: Invalid amount or reason }
        "403": { description: Administrator required }
  /daily007/v2/admin/matches/{id}/room:
    put:
      operationId: daily007V2SetRoom
      summary: Save or publish match room credentials
      description: Admin only. Setting published=true still does not reveal credentials until 15 minutes before match start.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Room credentials saved }
        "400": { description: Invalid room credentials or published flag }
  /daily007/v2/matches/{id}/room:
    get:
      operationId: daily007V2GetRoom
      summary: Get published room credentials
      description: Registered account only, and only from 15 minutes before match start.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Room id and password }
        "403": { description: Not registered or not yet available }
        "404": { description: Match or published credentials not found }
  /daily007/v2/admin/matches/{id}/registrations.csv:
    get:
      operationId: daily007V2ExportRegistrations
      summary: Export a match registration roster as CSV
      description: Admin only. CSV cells are formula-neutralized, escaped, and quoted; captain_game_uid is the submitted game UID, never the internal account UUID. Teammate game UIDs are optional.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: text/csv roster export }
        "403": { description: Administrator required }
        "404": { description: Match not found }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    Daily007V2CreateMatchBody:
      type: object
      additionalProperties: false
      properties:
        title: { type: string, minLength: 1, maxLength: 100 }
        mode: { type: string, enum: [solo, squad, clash] }
        startsAt:
          type: string
          format: date-time
          description: Must be a valid ISO timestamp strictly in the future.
        entryCoins: { type: integer, minimum: 0, maximum: 2147483647 }
      required: [title, mode, startsAt]
    Daily007V2UpdateMatchBody:
      type: object
      description: Include entryCoins and/or startsAt. If supplied, startsAt must be a valid future ISO timestamp; past matches cannot be updated.
      additionalProperties: false
      properties:
        startsAt: { type: string, format: date-time }
        entryCoins: { type: integer, minimum: 0, maximum: 2147483647 }
      minProperties: 1
    Daily007V2RegistrationBody:
      type: object
      additionalProperties: false
      properties:
        captainName: { type: string, minLength: 1, maxLength: 100 }
        captainGameUid: { type: string, minLength: 1, maxLength: 128 }
        teammates:
          type: array
          minItems: 3
          maxItems: 3
          description: Required in squad and clash modes; omitted for solo. Each teammate name is required, UID is optional.
          items:
            type: object
            additionalProperties: false
            properties:
              name: { type: string, minLength: 1, maxLength: 100 }
              uid:
                anyOf:
                  - { type: string, minLength: 1, maxLength: 128 }
                  - { type: "null" }
            required: [name]
      required: [captainName, captainGameUid]
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

