openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: |
    API specification. Daily007 v2 owns fresh accounts, wallets, and
    transactional game registration under /daily007/v2. The mobile client
    also uses Replit-backed compatibility routes under /auth, /tournaments,
    /wallet, /payments, /withdrawals, and /admin. Old unpublished hosted
    accounts and balances are intentionally not imported. The daily007_v2_*
    PostgreSQL schema is defined in lib/db/src/schema and is applied to
    development through the standard Drizzle push; managed production
    schema changes follow Replit Publish. Authentication uses
    DAILY007_AUTH_SECRET when configured, otherwise SESSION_SECRET
    (at least 32 characters). First-admin onboarding requires a
    separate DAILY007_ADMIN_BOOTSTRAP_TOKEN (at least 32 random characters).
    Admin onboarding: create a normal account, call POST
    /daily007/v2/admin/bootstrap with that account's bearer token and the
    configured bootstrapToken, then remove the bootstrap secret. There is no
    default or auto-created administrator. Mobile clients must use this
    project's /api path and pass bearer tokens; the current mobile client
    now uses a fresh Replit session rather than the former hosted API.
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /daily007/v2/auth/register:
    post:
      operationId: daily007V2RegisterAccount
      summary: Create an isolated Daily007 v2 account
      description: Passwords are stored as salted scrypt hashes. A valid referral code links the account and credits a one-time 10-coin signup bonus.
      responses:
        "201": { description: Account created; returns bearer token and account }
        "400": { description: Invalid input }
        "409": { description: Email already exists }
  /daily007/v2/auth/login:
    post:
      operationId: daily007V2Login
      summary: Authenticate a Daily007 v2 account
      responses:
        "200": { description: Bearer token and account }
        "401": { description: Invalid credentials }
  /auth/google:
    post:
      operationId: daily007GoogleSignIn
      summary: Sign in or link a Daily007 account with a verified Clerk Google identity
      description: |
        Requires a Clerk session bearer token. The server fetches the Clerk user
        and accepts only a Google external account with a verified email; client
        email and provider identity values are never trusted. Existing local
        accounts are not auto-linked: sign in with the password and retry with
        X-Daily007-Token to connect Google. A new account created with a valid
        referral code receives a one-time 10-coin signup bonus. The referrer
        receives 5 coins once after an admin-approved recharge of at least 50
        coins.
      security: [{ clerkBearerAuth: [] }]
      parameters:
        - name: X-Daily007-Token
          in: header
          required: false
          description: Existing Daily007 token for explicit account linking. Clerk authorization is still required.
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Daily007GoogleSignInBody" }
      responses:
        "200":
          description: Existing Google account or linked local account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Daily007GoogleSignInResponse" }
        "201":
          description: Google-only account created with a zero-coin wallet and user role
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Daily007GoogleSignInResponse" }
        "400": { description: Invalid request or unrecognized referral code }
        "401": { description: Missing/invalid Clerk session or invalid Daily007 link token }
        "403": { description: Google email is not verified or Daily007 account is blocked }
        "409": { description: Email or Google identity conflict; existing local accounts require password sign-in before linking }
        "503": { description: Clerk or Daily007 auth configuration unavailable }
  /daily007/v2/auth/me:
    get:
      operationId: daily007V2Me
      summary: Get authenticated account and wallet balance
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Account }
        "401": { description: Missing or invalid bearer token }
  /daily007/v2/admin/bootstrap:
    post:
      operationId: daily007V2BootstrapAdmin
      summary: Promote the authenticated account to the first administrator
      description: Requires configured bootstrap secret. Succeeds only while no v2 administrator exists.
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: First administrator created }
        "403": { description: Invalid bootstrap secret }
        "409": { description: Admin setup already completed }
  /daily007/v2/matches:
    get:
      operationId: daily007V2ListMatches
      summary: List match capacities, entry prices, and status
      responses:
        "200": { description: Match list; does not expose room credentials }
  /daily007/v2/leaderboards:
    get:
      operationId: daily007ListLeaderboards
      summary: Get the active weekly and monthly prize-coin leaderboards
      description: Scores are total match prize coins earned during the cycle. Weeks run Monday through Sunday and months follow the calendar in India Standard Time.
      responses:
        "200":
          description: Weekly and monthly leaderboard periods and standings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Daily007LeaderboardsResponse" }
  /daily007/v2/admin/leaderboards/periods:
    get:
      operationId: daily007AdminListLeaderboardPeriods
      summary: List ended leaderboard periods awaiting Full Admin approval
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Approveable ended periods, in cycle order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Daily007AdminLeaderboardPeriodsResponse" }
        "403": { description: Full Admin required }
  /daily007/v2/admin/leaderboards/periods/{id}/approve:
    post:
      operationId: daily007AdminApproveLeaderboardPeriod
      summary: Finalize standings, pay selected ranks, and activate the next cycle
      description: Full Admin only. Coin payouts and period transitions are committed in one transaction and cannot be repeated.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Daily007ApproveLeaderboardPeriodBody" }
      responses:
        "200":
          description: Period finalized and any configured coin payouts issued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Daily007ApproveLeaderboardPeriodResponse" }
        "400": { description: Invalid period id or payout configuration }
        "403": { description: Full Admin required }
        "404": { description: Period not found }
        "409": { description: Period is not ready or wallet balance would exceed its supported range }
  /daily007/v2/admin/matches:
    post:
      operationId: daily007V2CreateMatch
      summary: Create a match
      description: Admin only. Capacities are fixed to solo=48 registrations, squad=12 teams, and clash=2 teams. startsAt must be a future ISO timestamp; entryCoins must be a nonnegative integer.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Daily007V2CreateMatchBody" }
      responses:
        "201": { description: Match created }
        "400": { description: Invalid input }
        "403": { description: Administrator required }
  /daily007/v2/admin/matches/{id}:
    patch:
      operationId: daily007V2ConfigureMatch
      summary: Configure a match entry price
      description: Admin only; body may update entryCoins (a nonnegative integer), startsAt (a future ISO timestamp), or both.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Daily007V2UpdateMatchBody" }
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Updated match }
        "400": { description: Invalid input }
        "404": { description: Match not found }
  /daily007/v2/matches/{id}/register:
    post:
      operationId: daily007V2RegisterMatch
      summary: Register the authenticated account for a match
      description: Requires captainName (real name), captainGameName (Free Fire in-game name), and a nonempty captainGameUid (game identity, distinct from account ID). Team modes require exactly three teammate objects with a nonempty in-game name; uid is optional. The authenticated account is always the captain. Capacity and wallet debit are transactional. A repeated registration returns the original receipt without another debit.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Daily007V2RegistrationBody" }
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "201": { description: Registration and post-debit wallet balance }
        "200": { description: Existing registration receipt returned idempotently; no additional debit }
        "400": { description: Invalid input }
        "409": { description: "Full match, or insufficient wallet balance" }
  /daily007/v2/admin/users/{id}/wallet:
    post:
      operationId: daily007V2CreditWallet
      summary: Credit a user's wallet with an audited ledger entry
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Updated wallet balance }
        "400": { description: Invalid amount or reason }
        "403": { description: Administrator required }
  /admin/users/{id}/role:
    patch:
      operationId: daily007AdminSetUserRole
      summary: Assign or remove Tournament Admin access
      description: Full Admin only. The role can be set to player or tournament_admin, cannot be changed on the caller's account, and cannot demote the last Full Admin.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Daily007AdminUserRoleBody" }
      responses:
        "200": { description: Updated account role }
        "400": { description: Invalid user id or role }
        "403": { description: Full Admin required }
        "404": { description: User not found }
        "409": { description: Caller cannot change their own access or last Full Admin cannot be demoted }
  /daily007/v2/admin/matches/{id}/room:
    put:
      operationId: daily007V2SetRoom
      summary: Save or publish match room credentials
      description: Full Admin or Tournament Admin. Setting published=true still does not reveal credentials until 15 minutes before match start.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Room credentials saved }
        "400": { description: Invalid room credentials or published flag }
  /daily007/v2/matches/{id}/room:
    get:
      operationId: daily007V2GetRoom
      summary: Get published room credentials
      description: Registered account only, and only from 15 minutes before match start.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Room id and password }
        "403": { description: Not registered or not yet available }
        "404": { description: Match or published credentials not found }
  /daily007/v2/admin/matches/{id}/registrations.csv:
    get:
      operationId: daily007V2ExportRegistrations
      summary: Export a match registration roster as CSV
      description: Full Admin or Tournament Admin. CSV cells are formula-neutralized, escaped, and quoted; the export includes captain real name, in-game name, and game UID (never the internal account UUID). Teammate game UIDs are optional.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: text/csv roster export }
        "403": { description: Administrator required }
        "404": { description: Match not found }
  /wallet/uploads/request-url:
    post:
      operationId: daily007RequestWalletImageUpload
      summary: Request a private upload URL for a wallet image
      description: Payment proofs are scoped to the signed-in user; payment QR uploads require an administrator.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Daily007WalletImageUploadBody" }
      responses:
        "200":
          description: Short-lived upload URL and private object path
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Daily007WalletImageUploadResponse" }
        "400": { description: Invalid image type or size }
        "401": { description: Missing or invalid bearer token }
        "403": { description: Administrator required for QR uploads }
  /wallet/transactions:
    get:
      operationId: daily007GetWalletTransactions
      summary: List the authenticated user's wallet ledger
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Wallet ledger entries, newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Daily007WalletLedgerEntry" }
        "401": { description: Missing or invalid bearer token }
  /videos:
    get:
      operationId: daily007ListVideos
      summary: List active videos available to watch
      responses:
        "200":
          description: Active Daily007 videos
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Daily007VideoList" }
  /videos/watch/start:
    post:
      operationId: daily007StartVideoWatch
      summary: Start a reward-tracked playback session
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Daily007VideoWatchStartBody" }
      responses:
        "201":
          description: Playback session created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Daily007VideoWatchSession" }
        "400": { description: Invalid video id or duration }
        "401": { description: Missing or invalid bearer token }
        "404": { description: Video is unavailable }
  /videos/watch/complete:
    post:
      operationId: daily007CompleteVideoWatch
      summary: Claim one coin for a completed playback session
      description: |
        A playback session can earn at most once. A new playback session may earn
        again for the same video. Completion uses client-reported YouTube progress
        and elapsed time as best-effort checks, not proof that playback cannot be spoofed.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Daily007VideoWatchCompleteBody" }
      responses:
        "200":
          description: Reward result; retries of an already rewarded session do not credit again
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Daily007VideoWatchResult" }
        "400": { description: Invalid completion request }
        "401": { description: Missing or invalid bearer token }
        "404": { description: Playback session not found }
        "409": { description: Playback is incomplete or the video is unavailable }
  /admin/videos:
    get:
      operationId: daily007AdminListVideos
      summary: List managed videos for Full Admins
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Active and inactive video links
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Daily007VideoList" }
        "403": { description: Full Admin required }
    post:
      operationId: daily007AdminCreateVideo
      summary: Add a YouTube video link
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Daily007AdminVideoCreateBody" }
      responses:
        "201":
          description: Video created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Daily007Video" }
        "400": { description: Invalid title or YouTube URL }
        "403": { description: Full Admin required }
        "409": { description: This YouTube video is already managed }
  /admin/videos/{id}/active:
    patch:
      operationId: daily007AdminSetVideoActive
      summary: Activate or deactivate a managed YouTube video
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Daily007AdminVideoActiveBody" }
      responses:
        "200":
          description: Updated video
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Daily007Video" }
        "400": { description: Invalid video id or active state }
        "403": { description: Full Admin required }
        "404": { description: Video not found }
  /referrals:
    get:
      operationId: daily007GetMyReferrals
      summary: Get referral code, sharing link, reward totals, and referral statuses
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Referral dashboard for the authenticated account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Daily007ReferralDashboard" }
        "401": { description: Missing or invalid bearer token }
  /earn/youtube-subscribe:
    get:
      operationId: daily007GetYoutubeSubscribeTask
      summary: Get the YouTube subscribe task settings and the current user's claim status
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Task configuration and the authenticated user's latest claim
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Daily007YoutubeSubscribeTaskStatus" }
        "401": { description: Missing or invalid bearer token }
  /earn/youtube-subscribe/claims:
    post:
      operationId: daily007SubmitYoutubeSubscribeClaim
      summary: Submit a YouTube subscription claim for administrator review
      description: This endpoint creates a pending claim only. It never credits coins; an administrator must verify and approve it.
      security: [{ bearerAuth: [] }]
      responses:
        "201":
          description: New claim submitted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Daily007YoutubeSubscribeClaim" }
        "200":
          description: Existing pending or completed claim returned without a second claim
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Daily007YoutubeSubscribeClaim" }
        "401": { description: Missing or invalid bearer token }
        "409": { description: Task is disabled or the user already completed it }
  /admin/earn/youtube-subscribe/claims:
    get:
      operationId: daily007AdminListYoutubeSubscribeClaims
      summary: List YouTube subscription claims and completion totals for administrators
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Claim history with user identity and total completed rewards
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Daily007AdminYoutubeSubscribeClaims" }
        "403": { description: Administrator required }
  /admin/earn/youtube-subscribe/claims/{id}/{action}:
    post:
      operationId: daily007AdminReviewYoutubeSubscribeClaim
      summary: Approve or reject a pending YouTube subscription claim
      description: Approval credits the configured reward exactly once in the same transaction as the completion record.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: action, in: path, required: true, schema: { type: string, enum: [approve, reject] } }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Daily007YoutubeSubscribeReviewBody" }
      responses:
        "200":
          description: Claim reviewed; approved claims include their wallet transaction id
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Daily007YoutubeSubscribeClaim" }
        "400": { description: "Invalid request id, action, or rejection reason" }
        "403": { description: Administrator required }
        "404": { description: Claim not found }
        "409": { description: "Claim already reviewed, already rewarded, or wallet limit would be exceeded" }
  /payments:
    post:
      operationId: daily007SubmitRechargeRequest
      summary: Submit a manual UPI recharge for admin review
      description: Submitting a request never credits coins. An administrator must verify the UTR and proof before approval.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Daily007RechargeRequestBody" }
      responses:
        "201":
          description: Recharge request saved as pending
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Daily007PaymentRequest" }
        "400": { description: "Invalid amount, reference, proof, or configured limits" }
        "401": { description: Missing or invalid bearer token }
        "409": { description: "Recharge is disabled, a request is already pending, or the UTR was already used" }
  /my/payments:
    get:
      operationId: daily007GetMyRechargeRequests
      summary: List the authenticated user's recharge requests and review reasons
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Recharge requests, newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Daily007PaymentRequest" }
        "401": { description: Missing or invalid bearer token }
  /withdrawals:
    post:
      operationId: daily007SubmitWithdrawalRequest
      summary: Reserve wallet coins for a manual withdrawal request
      description: Coins are reserved atomically. Approval does not send money; the payout is handled and recorded manually.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Daily007WithdrawalRequestBody" }
      responses:
        "201":
          description: Withdrawal request saved as pending
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Daily007WithdrawalRequest" }
        "400": { description: Invalid amount or payout details }
        "401": { description: Missing or invalid bearer token }
        "409": { description: "Withdrawals are disabled, insufficient balance, or another request is pending" }
  /my/withdrawals:
    get:
      operationId: daily007GetMyWithdrawalRequests
      summary: List the authenticated user's withdrawal requests and payout status
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Withdrawal requests, newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Daily007WithdrawalRequest" }
        "401": { description: Missing or invalid bearer token }
  /admin/payments:
    get:
      operationId: daily007AdminListRechargeRequests
      summary: List recharge requests for admin review
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Recharge requests with player identity and proof availability }
        "403": { description: Administrator required }
  /admin/payments/{id}/proof-url:
    get:
      operationId: daily007AdminGetRechargeProofUrl
      summary: Get a short-lived private URL for a recharge screenshot
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Short-lived screenshot URL
          content:
            application/json:
              schema:
                type: object
                properties: { url: { type: string, format: uri } }
                required: [url]
        "403": { description: Administrator required }
        "404": { description: Proof is unavailable }
  /admin/payments/{id}/{action}:
    post:
      operationId: daily007AdminReviewRechargeRequest
      summary: Approve or reject a pending recharge
      description: Approval credits the wallet exactly once in a database transaction. Rejection requires a player-visible reason.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: action, in: path, required: true, schema: { type: string, enum: [approve, reject] } }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Daily007ReviewRequestBody" }
      responses:
        "200": { description: Request reviewed and user notified }
        "400": { description: "Invalid request id, action, or missing rejection reason" }
        "403": { description: Administrator required }
        "404": { description: Request not found }
        "409": { description: Request has already been reviewed or wallet limit would be exceeded }
  /admin/withdrawals:
    get:
      operationId: daily007AdminListWithdrawalRequests
      summary: List withdrawal requests for admin review
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Withdrawal requests with player identity and payout status }
        "403": { description: Administrator required }
  /admin/withdrawals/{id}/{action}:
    post:
      operationId: daily007AdminReviewWithdrawalRequest
      summary: Approve or reject a pending withdrawal
      description: Rejection refunds reserved coins atomically and requires a player-visible reason. Approval requires a separate manual payout.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: action, in: path, required: true, schema: { type: string, enum: [approve, reject] } }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Daily007ReviewRequestBody" }
      responses:
        "200": { description: Request reviewed and user notified }
        "400": { description: "Invalid request id, action, or missing rejection reason" }
        "403": { description: Administrator required }
        "404": { description: Request not found }
        "409": { description: Request has already been reviewed }
  /admin/withdrawals/{id}/payout:
    post:
      operationId: daily007AdminRecordManualWithdrawalPayout
      summary: Record that an approved withdrawal was paid manually
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Manual payout recorded and user notified }
        "403": { description: Administrator required }
        "404": { description: Withdrawal not found }
        "409": { description: Withdrawal is not awaiting manual payout }
  /settings:
    get:
      operationId: daily007GetPublicWalletSettings
      summary: Get public payment instructions and wallet limits
      responses:
        "200":
          description: Public settings; private QR storage path is omitted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Daily007PublicSettings" }
  /admin/settings:
    get:
      operationId: daily007AdminGetWalletSettings
      summary: Get wallet settings for administrators
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Settings including the private QR object path }
        "403": { description: Administrator required }
    put:
      operationId: daily007AdminSaveWalletSettings
      summary: Save wallet payment details, coin packages, limits, and enablement
      description: Recharge must remain disabled until an administrator configures the UPI ID and QR image, verifies they match, and explicitly enables it.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Daily007AdminSettingsBody" }
      responses:
        "200": { description: Saved settings }
        "400": { description: Invalid settings or unverified QR upload }
        "403": { description: Administrator required }
  /tournaments/{id}/slots:
    get:
      operationId: getTournamentSlots
      summary: List public slot or team occupancy without exposing room credentials
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Numbered slots with available, taken, or locked state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TournamentSlotsResponse" }
        "404": { description: Tournament not found }
  /tournaments/{id}/results:
    get:
      operationId: getTournamentResults
      summary: Get finalized public tournament results
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Finalized tournament results; draft data is never public
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TournamentResultsView" }
        "404": { description: Tournament not found }
  /admin/tournaments/{id}/lifecycle:
    post:
      operationId: updateTournamentLifecycle
      summary: Cancel an underfilled tournament after its scheduled start and refund paid entry fees
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TournamentLifecycleUpdate" }
      responses:
        "200":
          description: Tournament cancelled and paid entry fees refunded atomically
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      id: { type: string, format: uuid }
                      status: { type: string, enum: [cancelled] }
                      registrationsRefunded: { type: integer, minimum: 0 }
                      accountsRefunded: { type: integer, minimum: 0 }
                      coinsRefunded: { type: integer, minimum: 0 }
                    required: [id, status, registrationsRefunded, accountsRefunded, coinsRefunded]
                required: [success, data]
        "400": { description: Invalid cancellation request }
        "409": { description: "Tournament has not started, is full, has a winner, or was already cancelled" }
        "403": { description: Administrator required }
        "404": { description: Tournament not found }
  /admin/tournaments/{id}/results:
    get:
      operationId: getAdminTournamentResults
      summary: Get an administrator's saved draft or finalized results
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Draft/finalized result state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TournamentResultsView" }
        "403": { description: Administrator required }
        "404": { description: Tournament not found }
  /admin/results:
    get:
      operationId: daily007ListAdminResultLogs
      summary: List published result entries for completed tournaments
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Published winner and placement entries with settlement details
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminResultLogsResponse" }
        "403": { description: Tournament administrator required }
    post:
      operationId: saveTournamentResultDraft
      summary: Save one result entry as a draft without distributing rewards
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TournamentResultDraft" }
      responses:
        "200": { description: Draft saved; no wallet credits are made }
        "400": { description: Invalid result entry }
        "403": { description: Administrator required }
  /admin/tournaments/{id}/confirm-results:
    post:
      operationId: confirmTournamentResults
      summary: Finalize saved results and distribute each reward exactly once
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Results finalized and rewards processed }
        "409": { description: "Draft is missing, already finalized, or invalid" }
        "403": { description: Administrator required }
        "404": { description: Tournament not found }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    clerkBearerAuth:
      type: http
      scheme: bearer
  schemas:
    TournamentLifecycleUpdate:
      type: object
      additionalProperties: false
      properties:
        status: { type: string, enum: [cancelled] }
      required: [status]
    TournamentResultDraft:
      type: object
      additionalProperties: false
      properties:
        tournamentId: { type: string, format: uuid }
        registrationId: { type: string, format: uuid }
        rank: { type: integer, minimum: 1, maximum: 2147483647 }
        kills: { type: integer, minimum: 0, maximum: 2147483647 }
        prizeCoins: { type: integer, minimum: 0, maximum: 2147483647 }
      required: [tournamentId, registrationId, rank, kills, prizeCoins]
    TournamentResultEntry:
      type: object
      properties:
        registrationId: { type: string, format: uuid }
        rank: { type: integer }
        kills: { type: integer }
        prizeCoins: { type: integer }
      required: [registrationId, rank, kills, prizeCoins]
    TournamentResultsView:
      type: object
      properties:
        tournamentId: { type: string, format: uuid }
        status: { type: string, enum: [draft, finalized] }
        finalizedAt: { type: ["string", "null"], format: date-time }
        entries:
          type: array
          items: { $ref: "#/components/schemas/TournamentResultEntry" }
      required: [tournamentId, entries]
    AdminResultLog:
      type: object
      properties:
        tournamentId: { type: string, format: uuid }
        tournamentName: { type: string }
        registrationId: { type: string, format: uuid }
        playerName: { type: string }
        gameName: { type: ["string", "null"] }
        teamName: { type: ["string", "null"] }
        rank: { type: integer, minimum: 1 }
        kills: { type: integer, minimum: 0 }
        prizeCoins: { type: integer, minimum: 0 }
        createdAt: { type: string, format: date-time }
      required: [tournamentId, tournamentName, registrationId, playerName, rank, kills, prizeCoins, createdAt]
    AdminResultLogsResponse:
      type: object
      properties:
        success: { type: boolean }
        data:
          type: array
          items: { $ref: "#/components/schemas/AdminResultLog" }
      required: [success, data]
    TournamentSlot:
      type: object
      properties:
        number: { type: integer, minimum: 1 }
        status: { type: string, enum: [available, taken, locked] }
        teamName: { type: ["string", "null"] }
      required: [number, status]
    TournamentSlotsResponse:
      type: object
      properties:
        tournamentId: { type: string, format: uuid }
        mode: { type: string, enum: [solo, squad, clash] }
        capacity: { type: integer }
        filledCount: { type: integer }
        playersCount: { type: integer }
        slots:
          type: array
          items: { $ref: "#/components/schemas/TournamentSlot" }
      required: [tournamentId, mode, capacity, filledCount, playersCount, slots]
    Daily007V2CreateMatchBody:
      type: object
      additionalProperties: false
      properties:
        title: { type: string, minLength: 1, maxLength: 100 }
        mode: { type: string, enum: [solo, squad, clash] }
        startsAt:
          type: string
          format: date-time
          description: Must be a valid ISO timestamp strictly in the future.
        entryCoins: { type: integer, minimum: 0, maximum: 2147483647 }
      required: [title, mode, startsAt]
    Daily007V2UpdateMatchBody:
      type: object
      description: Include entryCoins and/or startsAt. If supplied, startsAt must be a valid future ISO timestamp; past matches cannot be updated.
      additionalProperties: false
      properties:
        startsAt: { type: string, format: date-time }
        entryCoins: { type: integer, minimum: 0, maximum: 2147483647 }
      minProperties: 1
    Daily007V2RegistrationBody:
      type: object
      additionalProperties: false
      properties:
        captainName: { type: string, minLength: 1, maxLength: 100 }
        captainGameName: { type: string, minLength: 1, maxLength: 100 }
        captainGameUid: { type: string, minLength: 1, maxLength: 128 }
        teammates:
          type: array
          minItems: 3
          maxItems: 3
          description: Required in squad and clash modes; omitted for solo. Each teammate name is required, UID is optional.
          items:
            type: object
            additionalProperties: false
            properties:
              name: { type: string, minLength: 1, maxLength: 100 }
              uid:
                anyOf:
                  - { type: string, minLength: 1, maxLength: 128 }
                  - { type: "null" }
            required: [name]
      required: [captainName, captainGameName, captainGameUid]
    Daily007GoogleSignInBody:
      type: object
      additionalProperties: false
      properties:
        referralCode: { type: string, maxLength: 64 }
    Daily007GoogleSignInResponse:
      type: object
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }
        coins: { type: integer, minimum: 0 }
        role: { type: string, enum: [user, admin] }
        token: { type: string }
      required: [id, name, email, coins, role, token]
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Daily007WalletImageUploadBody:
      type: object
      additionalProperties: false
      properties:
        purpose: { type: string, enum: [payment-proof, wallet-qr] }
        contentType: { type: string, enum: [image/jpeg, image/png, image/webp] }
        size: { type: integer, minimum: 1, maximum: 6291456 }
      required: [purpose, contentType, size]
    Daily007WalletImageUploadResponse:
      type: object
      properties:
        uploadUrl: { type: string, format: uri }
        objectPath: { type: string }
        expiresInSeconds: { type: integer, minimum: 1 }
      required: [uploadUrl, objectPath, expiresInSeconds]
    Daily007RechargeRequestBody:
      type: object
      additionalProperties: false
      description: Amount must equal coins. Supply txnId or reference with a private uploaded proof object path.
      properties:
        coins: { type: integer, minimum: 1, maximum: 2147483647 }
        amount: { type: integer, minimum: 1, maximum: 2147483647 }
        txnId: { type: string, minLength: 1, maxLength: 200 }
        reference: { type: string, minLength: 1, maxLength: 200 }
        proofObjectPath: { type: string, minLength: 1, maxLength: 500 }
      anyOf:
        - required: [txnId]
        - required: [reference]
      required: [coins, proofObjectPath]
    Daily007WithdrawalRequestBody:
      type: object
      additionalProperties: false
      properties:
        coins: { type: integer, minimum: 1, maximum: 2147483647 }
        method: { type: string, minLength: 1, maxLength: 40 }
        account: { type: string, minLength: 1, maxLength: 200 }
      required: [coins, method, account]
    Daily007ReviewRequestBody:
      type: object
      additionalProperties: false
      properties:
        reason: { type: string, minLength: 1, maxLength: 500 }
    Daily007PaymentRequest:
      type: object
      properties:
        id: { type: string, format: uuid }
        coins: { type: integer }
        amount: { type: integer }
        txnId: { type: string }
        status: { type: string, enum: [pending, approved, rejected, deleted] }
        reviewReason: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }
        reviewedAt: { type: [string, "null"], format: date-time }
      required: [id, coins, amount, status, createdAt]
    Daily007WithdrawalRequest:
      type: object
      properties:
        id: { type: string, format: uuid }
        coins: { type: integer }
        method: { type: string }
        account: { type: string }
        status: { type: string, enum: [pending, approved, rejected, deleted] }
        payoutStatus: { type: string, enum: [not_paid, manual_payout_required, paid] }
        reviewReason: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }
        reviewedAt: { type: [string, "null"], format: date-time }
      required: [id, coins, method, account, status, payoutStatus, createdAt]
    Daily007WalletLedgerEntry:
      type: object
      properties:
        id: { type: string, format: uuid }
        amount: { type: integer }
        balanceAfter: { type: integer }
        reason: { type: string }
        description: { type: string }
        details:
          anyOf:
            - { type: object, additionalProperties: true }
            - { type: "null" }
        createdAt: { type: string, format: date-time }
      required: [id, amount, balanceAfter, reason, description, createdAt]
    Daily007ReferralDashboard:
      type: object
      properties:
        code: { type: string }
        referralLink: { type: string, format: uri }
        totalPeopleReferred: { type: integer, minimum: 0 }
        successfulReferrals: { type: integer, minimum: 0 }
        pendingReferrals: { type: integer, minimum: 0 }
        totalReferralCoinsEarned: { type: integer, minimum: 0 }
        referrals:
          type: array
          items: { $ref: "#/components/schemas/Daily007ReferralStatus" }
      required: [code, referralLink, totalPeopleReferred, successfulReferrals, pendingReferrals, totalReferralCoinsEarned, referrals]
    Daily007ReferralStatus:
      type: object
      properties:
        id: { type: string, format: uuid }
        referredUserId: { type: string, format: uuid }
        referredName: { type: string }
        signupStatus: { type: string, enum: [complete] }
        signupBonusStatus: { type: string, enum: [credited, not_credited] }
        firstRechargeStatus:
          type: string
          enum: [rewarded, awaiting_approval, eligible_unrewarded, below_minimum, not_started]
        referrerRewardStatus: { type: string, enum: [credited, pending] }
        qualifyingPaymentId:
          anyOf:
            - { type: string, format: uuid }
            - { type: "null" }
        createdAt: { type: string, format: date-time }
      required: [id, referredUserId, referredName, signupStatus, signupBonusStatus, firstRechargeStatus, referrerRewardStatus, qualifyingPaymentId, createdAt]
    Daily007PublicSettings:
      type: object
      properties:
        upiId: { type: string }
        paymentNote: { type: string }
        minPurchase: { type: string }
        maxPurchase: { type: string }
        minWithdrawal: { type: string }
        coinPackages: { type: string, description: "Comma-separated administrator-configured coin package amounts" }
        rechargeEnabled: { type: boolean }
        withdrawalEnabled: { type: boolean }
        upiQrUrl: { type: string, format: uri }
        youtubeTaskEnabled: { type: boolean }
        youtubeTaskReward: { type: string }
        youtubeTaskUrl: { type: string, format: uri }
    Daily007AdminSettingsBody:
      type: object
      additionalProperties: false
      properties:
        appName: { type: string, maxLength: 300 }
        whatsappLink: { type: string, maxLength: 300 }
        instagramLink: { type: string, maxLength: 300 }
        youtubeLink: { type: string, maxLength: 300 }
        upiId: { type: string, maxLength: 300 }
        paymentNote: { type: string, maxLength: 1000 }
        supportContact: { type: string, maxLength: 300 }
        minPurchase: { type: string, maxLength: 300 }
        maxPurchase: { type: string, maxLength: 300 }
        minWithdrawal: { type: string, maxLength: 300 }
        coinPackages: { type: string, maxLength: 300 }
        rechargeEnabled: { type: string, enum: ["true", "false"] }
        withdrawalEnabled: { type: string, enum: ["true", "false"] }
        upiQrObjectPath: { type: string, maxLength: 500 }
        youtubeTaskEnabled: { type: string, enum: ["true", "false"] }
        youtubeTaskReward: { type: string, maxLength: 20 }
        youtubeTaskUrl: { type: string, maxLength: 300, format: uri }
    Daily007YoutubeSubscribeClaim:
      type: object
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [pending, approved, rejected] }
        rewardCoins: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
        reviewedAt:
          anyOf:
            - { type: string, format: date-time }
            - { type: "null" }
        reviewReason:
          anyOf:
            - { type: string }
            - { type: "null" }
        transactionId:
          anyOf:
            - { type: string, format: uuid }
            - { type: "null" }
        walletCoins:
          anyOf:
            - { type: integer, minimum: 0 }
            - { type: "null" }
      required: [id, status, rewardCoins, createdAt, reviewedAt, reviewReason, transactionId, walletCoins]
    Daily007YoutubeSubscribeTaskStatus:
      type: object
      properties:
        enabled: { type: boolean }
        rewardCoins: { type: integer, minimum: 1 }
        channelUrl: { type: string, format: uri }
        completed: { type: boolean }
        claim:
          anyOf:
            - { $ref: "#/components/schemas/Daily007YoutubeSubscribeClaim" }
            - { type: "null" }
      required: [enabled, rewardCoins, channelUrl, completed, claim]
    Daily007AdminYoutubeSubscribeClaim:
      type: object
      properties:
        id: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        userName: { type: string }
        email: { type: string, format: email }
        status: { type: string, enum: [pending, approved, rejected] }
        rewardCoins: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
        reviewedAt:
          anyOf:
            - { type: string, format: date-time }
            - { type: "null" }
        reviewReason:
          anyOf:
            - { type: string }
            - { type: "null" }
        transactionId:
          anyOf:
            - { type: string, format: uuid }
            - { type: "null" }
      required: [id, userId, userName, email, status, rewardCoins, createdAt, reviewedAt, reviewReason, transactionId]
    Daily007AdminYoutubeSubscribeClaims:
      type: object
      properties:
        totalCompleted: { type: integer, minimum: 0 }
        claims:
          type: array
          items: { $ref: "#/components/schemas/Daily007AdminYoutubeSubscribeClaim" }
      required: [totalCompleted, claims]
    Daily007YoutubeSubscribeReviewBody:
      type: object
      additionalProperties: false
      properties:
        reason: { type: string, maxLength: 500 }
    Daily007Video:
      type: object
      properties:
        id: { type: string, format: uuid }
        title: { type: string, minLength: 1, maxLength: 120 }
        youtubeId: { type: string, pattern: "^[A-Za-z0-9_-]{11}$" }
        url: { type: string, format: uri }
        active: { type: boolean }
        createdAt: { type: string, format: date-time }
      required: [id, title, youtubeId, url, active, createdAt]
    Daily007VideoList:
      type: object
      properties:
        videos:
          type: array
          items: { $ref: "#/components/schemas/Daily007Video" }
      required: [videos]
    Daily007VideoWatchStartBody:
      type: object
      additionalProperties: false
      properties:
        videoId: { type: string, format: uuid }
        durationSeconds: { type: integer, minimum: 5, maximum: 86400 }
      required: [videoId, durationSeconds]
    Daily007VideoWatchSession:
      type: object
      properties:
        sessionId: { type: string, format: uuid }
        startedAt: { type: string, format: date-time }
      required: [sessionId, startedAt]
    Daily007VideoWatchCompleteBody:
      type: object
      additionalProperties: false
      properties:
        sessionId: { type: string, format: uuid }
        percentWatched: { type: integer, minimum: 75, maximum: 100 }
      required: [sessionId, percentWatched]
    Daily007VideoWatchResult:
      type: object
      properties:
        rewarded: { type: boolean }
        coins: { type: integer, minimum: 0 }
        walletCoins: { type: integer, minimum: 0 }
        transactionId:
          anyOf:
            - { type: string, format: uuid }
            - { type: "null" }
        message: { type: string }
      required: [rewarded, coins, walletCoins, transactionId, message]
    Daily007AdminVideoCreateBody:
      type: object
      additionalProperties: false
      properties:
        title: { type: string, minLength: 1, maxLength: 120 }
        url: { type: string, format: uri, maxLength: 500 }
      required: [title, url]
    Daily007AdminVideoActiveBody:
      type: object
      additionalProperties: false
      properties:
        active: { type: boolean }
      required: [active]
    Daily007AdminUserRoleBody:
      type: object
      additionalProperties: false
      properties:
        role: { type: string, enum: [user, tournament_admin] }
      required: [role]
    Daily007LeaderboardStanding:
      type: object
      properties:
        rank: { type: integer, minimum: 1 }
        userId: { type: string, format: uuid }
        name: { type: string }
        points: { type: integer, minimum: 0, description: Total match prize coins earned during this period }
        earnings: { type: integer, minimum: 0 }
        wins: { type: integer, minimum: 0 }
        kills: { type: integer, minimum: 0 }
        matches: { type: integer, minimum: 0 }
      required: [rank, userId, name, points, earnings, wins, kills, matches]
    Daily007LeaderboardPeriod:
      type: object
      properties:
        id: { type: string, format: uuid }
        cycleType: { type: string, enum: [weekly, monthly] }
        status: { type: string, enum: [active, pending_approval, pending_activation, finalized] }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        standings:
          type: array
          items: { $ref: "#/components/schemas/Daily007LeaderboardStanding" }
      required: [id, cycleType, status, startsAt, endsAt, standings]
    Daily007LeaderboardsResponse:
      type: object
      properties:
        weekly: { $ref: "#/components/schemas/Daily007LeaderboardPeriod" }
        monthly: { $ref: "#/components/schemas/Daily007LeaderboardPeriod" }
      required: [weekly, monthly]
    Daily007AdminLeaderboardPeriodsResponse:
      type: object
      properties:
        periods:
          type: array
          items: { $ref: "#/components/schemas/Daily007LeaderboardPeriod" }
      required: [periods]
    Daily007LeaderboardPayout:
      type: object
      additionalProperties: false
      properties:
        rank: { type: integer, minimum: 1, maximum: 100 }
        coins: { type: integer, minimum: 1, maximum: 2147483647 }
      required: [rank, coins]
    Daily007ApproveLeaderboardPeriodBody:
      type: object
      additionalProperties: false
      properties:
        payouts:
          type: array
          maxItems: 10
          items: { $ref: "#/components/schemas/Daily007LeaderboardPayout" }
      required: [payouts]
    Daily007ApproveLeaderboardPeriodResponse:
      type: object
      properties:
        periodId: { type: string, format: uuid }
        status: { type: string, enum: [finalized] }
        payouts:
          type: array
          items:
            type: object
            properties:
              rank: { type: integer, minimum: 1 }
              userId: { type: string, format: uuid }
              coins: { type: integer, minimum: 1 }
              walletCoins: { type: integer, minimum: 0 }
            required: [rank, userId, coins, walletCoins]
        nextPeriodStatus: { type: string, enum: [active, pending_approval, pending_activation] }
      required: [periodId, status, payouts, nextPeriodStatus]

