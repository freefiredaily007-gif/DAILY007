openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: |
    API specification. Daily007 v2 owns fresh accounts, wallets, and
    transactional game registration under /daily007/v2. The mobile client
    also uses Replit-backed compatibility routes under /auth, /tournaments,
    /wallet, /payments, /withdrawals, and /admin. Old unpublished hosted
    accounts and balances are intentionally not imported. The daily007_v2_*
    PostgreSQL schema is defined in lib/db/src/schema and is applied to
    development through the standard Drizzle push; managed production
    schema changes follow Replit Publish. Authentication uses
    DAILY007_AUTH_SECRET when configured, otherwise SESSION_SECRET
    (at least 32 characters). First-admin onboarding requires a
    separate DAILY007_ADMIN_BOOTSTRAP_TOKEN (at least 32 random characters).
    Admin onboarding: create a normal account, call POST
    /daily007/v2/admin/bootstrap with that account's bearer token and the
    configured bootstrapToken, then remove the bootstrap secret. There is no
    default or auto-created administrator. Mobile clients must use this
    project's /api path and pass bearer tokens; the current mobile client
    now uses a fresh Replit session rather than the former hosted API.
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /daily007/v2/auth/register:
    post:
      operationId: daily007V2RegisterAccount
      summary: Create an isolated Daily007 v2 account
      description: Passwords are stored as salted scrypt hashes. A valid referral code links the account and credits a one-time 10-coin signup bonus.
      responses:
        "201": { description: Account created; returns bearer token and account }
        "400": { description: Invalid input }
        "409": { description: Email already exists }
  /daily007/v2/auth/login:
    post:
      operationId: daily007V2Login
      summary: Authenticate a Daily007 v2 account
      responses:
        "200": { description: Bearer token and account }
        "401": { description: Invalid credentials }
  /auth/me:
    get:
      operationId: getDaily007CurrentAccount
      summary: Get the authenticated Daily007 account and Google-link status
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Current account. Google linkage is exposed as a boolean; provider identifiers stay server-side.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Daily007CurrentAccount" }
        "401": { description: Missing or invalid bearer token }
  /auth/me/password:
    patch:
      operationId: daily007ChangePassword
      summary: Change the signed-in Daily007 account password
      description: |
        Requires the current Daily007 password. Updates only the local Daily007
        password; Google credentials are unchanged. Existing signed-in sessions
        remain valid.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Daily007ChangePasswordBody" }
      responses:
        "200":
          description: Password changed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Daily007ChangePasswordResult" }
        "400": { description: Invalid password-change request }
        "401":
          description: |
            Missing or invalid bearer tokens return an error message without a code.
            When the bearer token is valid but the current password is incorrect,
            the response includes the stable code `CURRENT_PASSWORD_INCORRECT`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Daily007PasswordChangeError" }
        "403": { description: Account is blocked }
        "404": { description: Account not found }
        "409": { description: Password changed concurrently; retry with the current password }
  /auth/google:
    post:
      operationId: daily007GoogleSignIn
      summary: Sign in or link a Daily007 account with a verified Clerk Google identity
      description: |
        Requires a Clerk session bearer token. The server fetches the Clerk user
        and accepts only a Google external account with a verified email; client
        email and provider identity values are never trusted. Existing local
        accounts are never auto-linked. A user may submit a separate recovery
        request, but only a Full Admin can link Google after independently
        verifying ownership. To link directly, sign in with the password and
        retry with X-Daily007-Token. A new account created with a valid
        referral code receives a one-time 10-coin signup bonus. The referrer
        receives 5 coins once after an admin-approved recharge of at least 50
        coins.
      security: [{ clerkBearerAuth: [] }]
      parameters:
        - name: X-Daily007-Token
          in: header
          required: false
          description: Existing Daily007 token for explicit account linking. Clerk authorization is still required.
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Daily007GoogleSignInBody" }
      responses:
        "200":
          description: Existing Google account or linked local account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Daily007GoogleSignInResponse" }
        "201":
          description: Google-only account created with a zero-coin wallet and user role
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Daily007GoogleSignInResponse" }
        "400": { description: Invalid request or unrecognized referral code }
        "401": { description: Missing/invalid Clerk session or invalid Daily007 link token }
        "403": { description: Google email is not verified or Daily007 account is blocked }
        "409": { description: Email or Google identity conflict; local accounts are never automatically linked }
        "503": { description: Clerk or Daily007 auth configuration unavailable }
  /auth/google/recovery-request:
    post:
      operationId: daily007GoogleRecoveryRequest
      summary: Request Full Admin review to link a verified Google identity to an existing Daily007 account
      description: |
        Requires a Clerk session bearer token. The server derives the identity and
        verified email from Clerk; the client cannot choose an account. This only
        creates a pending request and never creates an account or links Google.
        Full Admin approval must include an audit note and re-verify the Google
        identity. Matching email alone is not proof of account ownership.
      security: [{ clerkBearerAuth: [] }]
      responses:
        "202":
          description: Generic acknowledgment, whether or not an eligible account exists
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Daily007GoogleRecoveryRequestAccepted" }
        "401": { description: Missing or invalid Clerk session }
        "403": { description: No verified Google identity }
        "503": { description: Clerk identity could not be verified }
  /auth/google/recovery-owner:
    post:
      operationId: daily007GoogleOwnerRecovery
      summary: Recover the sole Full Admin account using a workspace owner recovery code
      description: |
        Requires a verified Google identity from Clerk and the separate owner
        recovery code configured in Replit Secrets. The server only permits this
        path for the sole active Full Admin account, records the owner-code
        review method, and never stores the submitted code.
      security: [{ clerkBearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Daily007GoogleOwnerRecoveryBody" }
      responses:
        "200":
          description: Owner recovery verified and Google linked to the existing account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Daily007GoogleOwnerRecoveryResult" }
        "401": { description: Missing or invalid Clerk session }
        "403": { description: Verified Google identity or owner recovery code was not accepted }
        "409": { description: Account is not eligible for sole Full Admin owner recovery }
        "429": { description: Too many recovery code attempts; wait before retrying }
        "503": { description: Clerk identity verification or owner recovery configuration unavailable }
  /daily007/v2/auth/me:
    get:
      operationId: daily007V2Me
      summary: Get authenticated account, wallet balance, and Google-link status
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Current account. Google linkage is exposed as a boolean; provider identifiers stay server-side.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Daily007CurrentAccount" }
        "401": { description: Missing or invalid bearer token }
  /daily007/v2/preferences/language:
    get:
      operationId: daily007V2GetLanguagePreference
      summary: Get the signed-in player's language preference
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Saved language, or null when the player has not chosen one
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Daily007LanguagePreference" }
        "401": { description: Missing or invalid bearer token }
    put:
      operationId: daily007V2SetLanguagePreference
      summary: Save the signed-in player's language preference if the expected value is current
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Daily007LanguagePreferenceUpdate" }
      responses:
        "200":
          description: Saved language preference, or the current server value when the expected value was stale
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Daily007LanguagePreferenceSaveResult" }
        "400": { description: Unsupported language }
        "401": { description: Missing or invalid bearer token }
  /daily007/v2/admin/bootstrap:
    post:
      operationId: daily007V2BootstrapAdmin
      summary: Promote the authenticated account to the first administrator
      description: Requires configured bootstrap secret. Succeeds only while no v2 administrator exists.
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: First administrator created }
        "403": { description: Invalid bootstrap secret }
        "409": { description: Admin setup already completed }
  /daily007/v2/matches:
    get:
      operationId: daily007V2ListMatches
      summary: List match capacities, entry prices, and status
      responses:
        "200": { description: Match list; does not expose room credentials }
  /daily007/v2/leaderboards:
    get:
      operationId: daily007ListLeaderboards
      summary: Get the active weekly and monthly prize-coin leaderboards
      description: Scores are total match prize coins earned during the cycle. Weeks run Monday through Sunday and months follow the calendar in India Standard Time.
      responses:
        "200":
          description: Weekly and monthly leaderboard periods and standings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Daily007LeaderboardsResponse" }
  /daily007/v2/admin/leaderboards/rewards:
    get:
      operationId: daily007AdminGetLeaderboardRewards
      summary: Get Full Admin weekly and monthly top-three reward amounts
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Reward amounts, cycle status, and whether the next cycle can be scheduled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Daily007AdminLeaderboardRewardsResponse" }
        "403": { description: Full Admin required }
    put:
      operationId: daily007AdminUpdateLeaderboardRewards
      summary: Update rewards for an open or already scheduled cycle
      description: Full Admin only. Updates only the weekly or monthly cycle included in the request; values do not carry forward automatically. Ended-cycle payout snapshots cannot be changed.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Daily007AdminUpdateLeaderboardRewardsBody" }
      responses:
        "200":
          description: Current weekly and monthly settings and lifecycle status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Daily007AdminLeaderboardRewardsResponse" }
        "400": { description: Reward values must be whole coin amounts from 0 to 2147483647 }
        "403": { description: Full Admin required }
  /daily007/v2/admin/leaderboards/cycles/start:
    post:
      operationId: daily007AdminStartLeaderboardCycle
      summary: Set fresh prizes and schedule the next leaderboard cycle
      description: Full Admin only. Requires all completed cycles of this type to be approved. The new cycle is scheduled for the next IST calendar boundary and activates then; reward values are not carried forward.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Daily007AdminStartLeaderboardCycleBody" }
      responses:
        "201":
          description: New cycle scheduled for its next IST calendar boundary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Daily007AdminLeaderboardRewardsResponse" }
        "400": { description: Invalid cycle type or reward amount }
        "403": { description: Full Admin required }
        "409": { description: A previous cycle still needs approval or a cycle is already open or scheduled }
  /daily007/v2/admin/leaderboards/approvals:
    get:
      operationId: daily007AdminGetLeaderboardApprovals
      summary: List weekly and monthly leaderboard cycles awaiting approval
      description: Full Admin only. Each period includes the standings snapshot and configured rewards that will be paid on approval.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Periods awaiting Full Admin approval
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Daily007AdminLeaderboardApprovalsResponse" }
        "403": { description: Full Admin required }
  /daily007/v2/admin/leaderboards/periods/{periodId}/approve:
    post:
      operationId: daily007AdminApproveLeaderboardPeriod
      summary: Approve and pay a completed leaderboard cycle
      description: Full Admin only. Credits configured rank rewards, records resulting wallet balances, and finalizes the period atomically. Repeating the request is idempotent.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: periodId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Approval result, including each payout and resulting wallet balance
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Daily007AdminApproveLeaderboardPeriodResponse" }
        "400": { description: Invalid period id }
        "403": { description: Full Admin required }
        "404": { description: Leaderboard period not found }
        "409": { description: Cycle is not ready for approval or payout cannot be completed }
  /daily007/v2/admin/matches:
    post:
      operationId: daily007V2CreateMatch
      summary: Create a match
      description: Admin only. Capacities are fixed to solo=48 registrations, squad=12 teams, and clash=2 teams. startsAt must be a future ISO timestamp; entryCoins must be a nonnegative integer.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Daily007V2CreateMatchBody" }
      responses:
        "201": { description: Match created }
        "400": { description: Invalid input }
        "403": { description: Administrator required }
  /daily007/v2/admin/matches/{id}:
    patch:
      operationId: daily007V2ConfigureMatch
      summary: Configure a match entry price
      description: Admin only; body may update entryCoins (a nonnegative integer), startsAt (a future ISO timestamp), or both.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Daily007V2UpdateMatchBody" }
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Updated match }
        "400": { description: Invalid input }
        "404": { description: Match not found }
  /daily007/v2/matches/{id}/register:
    post:
      operationId: daily007V2RegisterMatch
      summary: Register the authenticated account for a match
      description: Requires captainName, captainGameName, and a nonempty captainGameUid. Duo and squad registrations require the number of teammates matching the selected format; solo registrations omit teammates. seatGroupNumber persists the requested team or player-slot group. The authenticated account is always the captain. Capacity, group assignment, and wallet debit are transactional. A repeated registration returns the original receipt without another debit.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Daily007V2RegistrationBody" }
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "201":
          description: Registration, assigned team/player group, and post-debit wallet balance.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Daily007V2RegistrationResponse" }
        "200":
          description: Existing registration receipt returned idempotently; no additional debit.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Daily007V2RegistrationResponse" }
        "400":
          description: Invalid input. Recognized registration validation failures may include the field or fields to correct.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
                  fieldErrors:
                    type: object
                    additionalProperties: { type: string }
                    description: Optional field-keyed validation messages; absent for capacity, network, and database failures.
                required: [error]
        "409":
          description: Registration conflict. Each response includes a stable code while retaining a readable error message.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
                  code:
                    type: string
                    enum:
                      - ALREADY_REGISTERED
                      - GAME_UID_ALREADY_REGISTERED
                      - INSUFFICIENT_BALANCE
                      - MATCH_CLOSED
                      - MATCH_FULL
                      - REGISTRATION_REJECTED
                      - SEAT_UNAVAILABLE
                      - TOURNAMENT_DISABLED
                    description: Stable reason for the registration conflict.
                required: [error, code]
  /daily007/v2/admin/users/{id}/wallet:
    post:
      operationId: daily007V2CreditWallet
      summary: Credit a user's wallet with an audited ledger entry
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Updated wallet balance }
        "400": { description: Invalid amount or reason }
        "403": { description: Administrator required }
  /daily007/v2/admin/users/{id}/wallet-history:
    get:
      operationId: daily007V2AdminUserWalletHistory
      summary: List one user's wallet ledger for Full Admin review
      description: Full Admin only. Results are scoped to the requested user and use a stable newest-first cursor.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: cursor, in: query, required: false, schema: { type: string, maxLength: 512 } }
      responses:
        "200":
          description: A page of wallet transactions, newest first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Daily007AdminWalletHistoryPage" }
        "400": { description: Invalid user ID or history cursor }
        "401": { description: Missing or invalid bearer token }
        "403": { description: Full Admin required }
        "404": { description: User not found }
  /admin/users/{id}/role:
    patch:
      operationId: daily007AdminSetUserRole
      summary: Assign or remove Tournament Admin access
      description: Full Admin only. The role can be set to player or tournament_admin, cannot be changed on the caller's account, and cannot demote the last Full Admin.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Daily007AdminUserRoleBody" }
      responses:
        "200": { description: Updated account role }
        "400": { description: Invalid user id or role }
        "403": { description: Full Admin required }
        "404": { description: User not found }
        "409": { description: Caller cannot change their own access or last Full Admin cannot be demoted }
  /admin/users/{id}/delete:
    post:
      operationId: daily007AdminDeleteUser
      summary: Permanently remove a player and their associated data
      description: Full Admin only. Only regular player accounts can be removed. The account is blocked first, then its Clerk identity and private payment-proof files are deleted, and all linked database data is removed in one transaction. The confirmation email must match the target account.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Daily007AdminUserDeletionInput" }
      responses:
        "200":
          description: The account and linked data were permanently removed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Daily007AdminUserDeletionResponse" }
        "400": { description: Invalid user id or confirmation email }
        "401": { description: Daily007 account required }
        "403": { description: Full Admin required }
        "404": { description: User not found }
        "409": { description: "Self-deletion, privileged roles, or retained administrator attribution prevents deletion" }
        "502": { description: External identity or stored-file cleanup failed; the account remains blocked and can be retried }
        "500": { description: Database cleanup failed; retry the blocked account deletion }
  /admin/account-recovery-requests:
    get:
      operationId: daily007AdminListAccountRecoveryRequests
      summary: List pending Google account recovery requests
      description: Full Admin only. Tournament Admins cannot view recovery requests.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Pending recovery requests, oldest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Daily007AdminAccountRecoveryRequest" }
        "401": { description: Daily007 bearer token required }
        "403": { description: Full Admin required }
  /admin/account-recovery-requests/{id}/{action}:
    post:
      operationId: daily007AdminReviewAccountRecoveryRequest
      summary: Approve or reject a Google account recovery request
      description: |
        Full Admin only. Requires a 10–500 character audit note. Approval is
        forbidden for the requesting account itself and re-verifies the Clerk
        Google identity and its verified email before linking it.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: action, in: path, required: true, schema: { type: string, enum: [approve, reject] } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Daily007AdminAccountRecoveryReviewBody" }
      responses:
        "200":
          description: Request reviewed; approved requests link Google to the existing account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Daily007AdminAccountRecoveryReviewResult" }
        "400": { description: "Invalid request, action, or review note" }
        "401": { description: Daily007 bearer token required }
        "403": { description: Full Admin required }
        "404": { description: Pending request not found }
        "409": { description: "Request already reviewed, self-review, or identity/account changed" }
        "503": { description: Clerk identity could not be re-verified }
  /daily007/v2/admin/matches/{id}/room:
    put:
      operationId: daily007V2SetRoom
      summary: Save match room credentials for scheduled release
      description: Full Admin or Tournament Admin. Credentials become available only to approved registrants from five minutes before the scheduled start.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [roomId, roomPassword]
              properties:
                roomId: { type: string, minLength: 1, maxLength: 200 }
                roomPassword: { type: string, minLength: 1, maxLength: 200 }
      responses:
        "200": { description: Room credentials saved and scheduled for automatic release }
        "400": { description: Invalid room credentials }
        "403": { description: Tournament administrator required }
        "404": { description: Match not found }
  /daily007/v2/matches/{id}/squad-slots:
    get:
      operationId: daily007V2GetSquadSlots
      summary: Get individually selectable team player slots
      description: Requires authentication. Returns the selected format's teams and per-player seat state. Public Free Fire names are returned; UIDs, account IDs, profile names, and contact details remain private.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Team and seat counts follow the match's game mode and format.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Daily007V2SquadSlotsResponse" }
        "401": { description: Authentication required }
        "404": { description: Match not found }
        "409": { description: Match does not use team player slots }
  /daily007/v2/matches/{id}/squad-join:
    post:
      operationId: daily007V2JoinSquadSlot
      summary: Join one open team player slot with the authenticated account
      description: Assigns the authenticated player to one team and slot, charging only that player's wallet. A retry returns the saved receipt without a second charge. The first player in an empty team becomes its captain.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Daily007V2SquadJoinBody" }
      responses:
        "201":
          description: Player assigned and individual entry fee processed atomically
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Daily007V2SquadJoinResponse" }
        "200":
          description: Existing slot registration receipt returned without a second debit
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Daily007V2SquadJoinResponse" }
        "400": { description: "Invalid team, slot, or Free Fire identity" }
        "401": { description: Authentication required }
        "409": { description: "Slot unavailable, registration closed, duplicate identity, or insufficient balance" }
  /daily007/v2/matches/{id}/squad-slots/{teamNumber}/{slotNumber}:
    delete:
      operationId: daily007V2RemoveSquadMember
      summary: Remove an eligible teammate from the captain's team
      description: Only the captain can remove another active member of their own non-legacy team, before registration closes. The removed player's paid entry fee is not refunded; the audit and wallet ledger entries remain intact. If a captain is removed by an administrator, captaincy transfers to the next active member.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: teamNumber, in: path, required: true, schema: { type: integer, minimum: 1, maximum: 12 } }
        - { name: slotNumber, in: path, required: true, schema: { type: integer, minimum: 1, maximum: 4 } }
      responses:
        "200":
          description: Teammate removed and slot reopened without refund
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Daily007V2SquadRemovalResponse" }
        "401": { description: Authentication required }
        "403": { description: Only the team's captain may remove an eligible teammate }
        "404": { description: Team or player slot not found }
        "409": { description: "Match closed, captain cannot remove themselves, or legacy team cannot be edited" }
  /daily007/v2/matches/{id}/room:
    get:
      operationId: daily007V2GetRoom
      summary: Get scheduled room credentials
      description: Approved registrants only. Credentials are unavailable before five minutes prior to the scheduled start and are never returned for cancelled matches.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Room id and password }
        "403": { description: Not registered or before the automatic release time }
        "404": { description: Match or saved credentials not found }
  /daily007/v2/admin/matches/{id}/registrations.csv:
    get:
      operationId: daily007V2ExportRegistrations
      summary: Export a match registration roster as CSV
      description: Full Admin or Tournament Admin. CSV cells are formula-neutralized, escaped, and quoted; the export includes captain real name, in-game name, and game UID (never the internal account UUID). Teammate game UIDs are optional.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: text/csv roster export }
        "403": { description: Administrator required }
        "404": { description: Match not found }
  /wallet/uploads/request-url:
    post:
      operationId: daily007RequestWalletImageUpload
      summary: Request a private upload URL for a wallet image
      description: Payment proofs are scoped to the signed-in user; payment QR uploads require an administrator.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Daily007WalletImageUploadBody" }
      responses:
        "200":
          description: Short-lived upload URL and private object path
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Daily007WalletImageUploadResponse" }
        "400": { description: Invalid image type or size }
        "401": { description: Missing or invalid bearer token }
        "403": { description: Administrator required for QR uploads }
  /wallet/transactions:
    get:
      operationId: daily007GetWalletTransactions
      summary: List the authenticated user's wallet ledger
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Wallet ledger entries, newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Daily007WalletLedgerEntry" }
        "401": { description: Missing or invalid bearer token }
  /videos:
    get:
      operationId: daily007ListVideos
      summary: List active videos available to watch
      responses:
        "200":
          description: Active Daily007 videos
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Daily007VideoList" }
  /videos/watch/start:
    post:
      operationId: daily007StartVideoWatch
      summary: Start or retrieve a reward-tracked playback session
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Daily007VideoWatchStartBody" }
      responses:
        "201":
          description: Playback session created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Daily007VideoWatchSession" }
        "200":
          description: Existing playback session returned for the same attempt identity
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Daily007VideoWatchSession" }
        "400": { description: "Invalid video id, duration, or playback attempt identity" }
        "401": { description: Missing or invalid bearer token }
        "404": { description: Video is unavailable }
        "409": { description: Playback attempt identity was already used with different details }
  /videos/watch/complete:
    post:
      operationId: daily007CompleteVideoWatch
      summary: Claim one coin for a completed playback session
      description: |
        A playback session can earn at most once. A new playback session may earn
        again for the same video. Completion uses client-reported YouTube progress
        and elapsed time as best-effort checks, not proof that playback cannot be spoofed.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Daily007VideoWatchCompleteBody" }
      responses:
        "200":
          description: Reward result; retries of an already rewarded session do not credit again
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Daily007VideoWatchResult" }
        "400": { description: Invalid completion request }
        "401": { description: Missing or invalid bearer token }
        "404": { description: Playback session not found }
        "409": { description: Playback is incomplete or the video is unavailable }
  /admin/videos:
    get:
      operationId: daily007AdminListVideos
      summary: List managed videos for Full Admins
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Active and inactive video links
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Daily007VideoList" }
        "403": { description: Full Admin required }
    post:
      operationId: daily007AdminCreateVideo
      summary: Add a YouTube video link
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Daily007AdminVideoCreateBody" }
      responses:
        "201":
          description: Video created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Daily007Video" }
        "400": { description: Invalid title or YouTube URL }
        "403": { description: Full Admin required }
        "409": { description: This YouTube video is already managed }
  /admin/videos/{id}:
    patch:
      operationId: daily007AdminUpdateVideo
      summary: Update a managed video's title, topic, or YouTube link
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Daily007VideoUpdate" }
      responses:
        "200":
          description: Updated video
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Daily007Video" }
        "400": { description: "Invalid video id, title, topic, or YouTube URL" }
        "403": { description: Full Admin required }
        "404": { description: Video not found }
        "409": { description: Duplicate YouTube video or existing watch history prevents changing its link }
    delete:
      operationId: daily007AdminDeleteVideo
      summary: Permanently delete a managed video only when it has no watch history
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Video permanently deleted }
        "400": { description: Invalid video id }
        "403": { description: Full Admin required }
        "404": { description: Video not found }
        "409": { description: Video has watch history; hide it instead }
  /admin/videos/{id}/active:
    patch:
      operationId: daily007AdminSetVideoActive
      summary: Activate or deactivate a managed YouTube video
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Daily007AdminVideoActiveBody" }
      responses:
        "200":
          description: Updated video
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Daily007Video" }
        "400": { description: Invalid video id or active state }
        "403": { description: Full Admin required }
        "404": { description: Video not found }
  /referrals:
    get:
      operationId: daily007GetMyReferrals
      summary: Get referral code, sharing link, reward totals, and referral statuses
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Referral dashboard for the authenticated account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Daily007ReferralDashboard" }
        "401": { description: Missing or invalid bearer token }
  /earn/youtube-subscribe:
    get:
      operationId: daily007GetYoutubeSubscribeTask
      summary: Get the YouTube subscribe task settings and the current user's claim status
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Task configuration and the authenticated user's latest claim
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Daily007YoutubeSubscribeTaskStatus" }
        "401": { description: Missing or invalid bearer token }
  /earn/youtube-subscribe/claims:
    post:
      operationId: daily007SubmitYoutubeSubscribeClaim
      summary: Submit a YouTube subscription claim for administrator review
      description: This endpoint creates a pending claim only. It never credits coins; an administrator must verify and approve it.
      security: [{ bearerAuth: [] }]
      responses:
        "201":
          description: New claim submitted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Daily007YoutubeSubscribeClaim" }
        "200":
          description: Existing pending or completed claim returned without a second claim
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Daily007YoutubeSubscribeClaim" }
        "401": { description: Missing or invalid bearer token }
        "409": { description: Task is disabled or the user already completed it }
  /admin/earn/youtube-subscribe/claims:
    get:
      operationId: daily007AdminListYoutubeSubscribeClaims
      summary: List YouTube subscription claims and completion totals for administrators
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Claim history with user identity and total completed rewards
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Daily007AdminYoutubeSubscribeClaims" }
        "403": { description: Administrator required }
  /admin/earn/youtube-subscribe/claims/{id}/{action}:
    post:
      operationId: daily007AdminReviewYoutubeSubscribeClaim
      summary: Approve or reject a pending YouTube subscription claim
      description: Approval credits the configured reward exactly once in the same transaction as the completion record.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: action, in: path, required: true, schema: { type: string, enum: [approve, reject] } }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Daily007YoutubeSubscribeReviewBody" }
      responses:
        "200":
          description: Claim reviewed; approved claims include their wallet transaction id
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Daily007YoutubeSubscribeClaim" }
        "400": { description: "Invalid request id, action, or rejection reason" }
        "403": { description: Administrator required }
        "404": { description: Claim not found }
        "409": { description: "Claim already reviewed, already rewarded, or wallet limit would be exceeded" }
  /earn/instagram-follow:
    get:
      operationId: daily007GetInstagramFollowTask
      summary: Get Instagram follow task settings and the current user's claim status
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Task configuration and the authenticated user's latest claim
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Daily007InstagramFollowTaskStatus" }
        "401": { description: Missing or invalid bearer token }
  /earn/instagram-follow/claims:
    post:
      operationId: daily007SubmitInstagramFollowClaim
      summary: Submit an Instagram follow claim for administrator review
      description: This endpoint creates a pending claim only. It never credits coins; an administrator must verify and approve it.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Daily007InstagramFollowClaimBody" }
      responses:
        "201":
          description: New claim submitted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Daily007InstagramFollowClaim" }
        "200":
          description: Existing pending or completed claim returned without a second claim
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Daily007InstagramFollowClaim" }
        "400": { description: Invalid Instagram username or proof text }
        "401": { description: Missing or invalid bearer token }
        "409": { description: Task is disabled or the user already completed it }
  /admin/earn/instagram-follow/claims:
    get:
      operationId: daily007AdminListInstagramFollowClaims
      summary: List Instagram follow claims and completion totals for administrators
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Claim history with Instagram username, proof, and user identity
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Daily007AdminInstagramFollowClaims" }
        "403": { description: Administrator required }
  /admin/earn/instagram-follow/claims/{id}/{action}:
    post:
      operationId: daily007AdminReviewInstagramFollowClaim
      summary: Approve or reject a pending Instagram follow claim
      description: Approval credits the reward captured on the claim exactly once in the same transaction as the completion record.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: action, in: path, required: true, schema: { type: string, enum: [approve, reject] } }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Daily007YoutubeSubscribeReviewBody" }
      responses:
        "200":
          description: Claim reviewed; approved claims include their wallet transaction id
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Daily007InstagramFollowClaim" }
        "400": { description: "Invalid request id, action, or rejection reason" }
        "403": { description: Administrator required }
        "404": { description: Claim not found }
        "409": { description: "Claim already reviewed, already rewarded, or wallet limit would be exceeded" }
  /payments:
    post:
      operationId: daily007SubmitRechargeRequest
      summary: Submit a manual UPI recharge for admin review
      description: Submitting a request never credits coins. An administrator must verify the UTR and proof before approval.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Daily007RechargeRequestBody" }
      responses:
        "201":
          description: Recharge request saved as pending
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Daily007PaymentRequest" }
        "400": { description: "Invalid amount, reference, proof, or configured limits" }
        "401": { description: Missing or invalid bearer token }
        "409": { description: "Recharge is disabled, a request is already pending, or the UTR was already used" }
  /my/payments:
    get:
      operationId: daily007GetMyRechargeRequests
      summary: List the authenticated user's recharge requests and review reasons
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Recharge requests, newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Daily007PaymentRequest" }
        "401": { description: Missing or invalid bearer token }
  /withdrawals:
    post:
      operationId: daily007SubmitWithdrawalRequest
      summary: Reserve wallet coins for a manual withdrawal request
      description: Coins are reserved atomically. Approval does not send money; the payout is handled and recorded manually.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Daily007WithdrawalRequestBody" }
      responses:
        "201":
          description: Withdrawal request saved as pending
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Daily007WithdrawalRequest" }
        "400": { description: Invalid amount or payout details }
        "401": { description: Missing or invalid bearer token }
        "409": { description: "Withdrawals are disabled, insufficient balance, or another request is pending" }
  /my/withdrawals:
    get:
      operationId: daily007GetMyWithdrawalRequests
      summary: List the authenticated user's withdrawal requests and payout status
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Withdrawal requests, newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Daily007WithdrawalRequest" }
        "401": { description: Missing or invalid bearer token }
  /admin/payments:
    get:
      operationId: daily007AdminListRechargeRequests
      summary: List recharge requests for admin review
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Recharge requests with player identity and proof availability }
        "403": { description: Administrator required }
  /admin/payments/{id}/proof-url:
    get:
      operationId: daily007AdminGetRechargeProofUrl
      summary: Get a short-lived private URL for a recharge screenshot
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Short-lived screenshot URL
          content:
            application/json:
              schema:
                type: object
                properties: { url: { type: string, format: uri } }
                required: [url]
        "403": { description: Administrator required }
        "404": { description: Proof is unavailable }
  /admin/payments/{id}/{action}:
    post:
      operationId: daily007AdminReviewRechargeRequest
      summary: Approve or reject a pending recharge
      description: Approval credits the wallet exactly once in a database transaction. Rejection requires a player-visible reason.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: action, in: path, required: true, schema: { type: string, enum: [approve, reject] } }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Daily007ReviewRequestBody" }
      responses:
        "200": { description: Request reviewed and user notified }
        "400": { description: "Invalid request id, action, or missing rejection reason" }
        "403": { description: Administrator required }
        "404": { description: Request not found }
        "409": { description: Request has already been reviewed or wallet limit would be exceeded }
  /admin/withdrawals:
    get:
      operationId: daily007AdminListWithdrawalRequests
      summary: List withdrawal requests for admin review
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Withdrawal requests with player identity and payout status }
        "403": { description: Administrator required }
  /admin/withdrawals/{id}/{action}:
    post:
      operationId: daily007AdminReviewWithdrawalRequest
      summary: Approve or reject a pending withdrawal
      description: Rejection refunds reserved coins atomically and requires a player-visible reason. Approval requires a separate manual payout.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: action, in: path, required: true, schema: { type: string, enum: [approve, reject] } }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Daily007ReviewRequestBody" }
      responses:
        "200": { description: Request reviewed and user notified }
        "400": { description: "Invalid request id, action, or missing rejection reason" }
        "403": { description: Administrator required }
        "404": { description: Request not found }
        "409": { description: Request has already been reviewed }
  /admin/withdrawals/{id}/payout:
    post:
      operationId: daily007AdminRecordManualWithdrawalPayout
      summary: Record that an approved withdrawal was paid manually
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Manual payout recorded and user notified }
        "403": { description: Administrator required }
        "404": { description: Withdrawal not found }
        "409": { description: Withdrawal is not awaiting manual payout }
  /settings:
    get:
      operationId: daily007GetPublicWalletSettings
      summary: Get public payment instructions and wallet limits
      responses:
        "200":
          description: Public settings; private QR storage path is omitted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Daily007PublicSettings" }
  /admin/settings:
    get:
      operationId: daily007AdminGetWalletSettings
      summary: Get wallet settings for administrators
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Settings including the private QR object path }
        "403": { description: Administrator required }
    put:
      operationId: daily007AdminSaveWalletSettings
      summary: Save wallet payment details, coin packages, limits, and enablement
      description: Recharge must remain disabled until an administrator configures the UPI ID and QR image, verifies they match, and explicitly enables it.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Daily007AdminSettingsBody" }
      responses:
        "200": { description: Saved settings }
        "400": { description: Invalid settings or unverified QR upload }
        "403": { description: Administrator required }
  /tournaments/{id}/participants:
    get:
      operationId: getTournamentParticipants
      summary: List the joined public player names and teams for a tournament
      description: Lists active approved and pending registrations with Free Fire in-game names only; account IDs, contact details, game UIDs, and application profile names are not exposed.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Public participant roster
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TournamentParticipantsResponse" }
        "404": { description: Tournament not found }
  /tournaments/{id}/slots:
    get:
      operationId: getTournamentSlots
      summary: List public slot or team occupancy without exposing room credentials
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Numbered slots with available, taken, or locked state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TournamentSlotsResponse" }
        "404": { description: Tournament not found }
  /tournaments/{id}/results:
    get:
      operationId: getTournamentResults
      summary: Get finalized public tournament results
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Finalized tournament results; draft data is never public
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TournamentResultsView" }
        "400": { description: Invalid tournament id }
        "404": { description: Tournament not found }
  /admin/tournaments/{id}/lifecycle:
    post:
      operationId: updateTournamentLifecycle
      summary: Cancel an underfilled tournament after its scheduled start and refund paid entry fees
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TournamentLifecycleUpdate" }
      responses:
        "200":
          description: Tournament cancelled and paid entry fees refunded atomically
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      id: { type: string, format: uuid }
                      status: { type: string, enum: [cancelled] }
                      registrationsRefunded: { type: integer, minimum: 0 }
                      accountsRefunded: { type: integer, minimum: 0 }
                      coinsRefunded: { type: integer, minimum: 0 }
                    required: [id, status, registrationsRefunded, accountsRefunded, coinsRefunded]
                required: [success, data]
        "400": { description: Invalid cancellation request }
        "409": { description: "Tournament has not started, is full, has a winner, or was already cancelled" }
        "403": { description: Administrator required }
        "404": { description: Tournament not found }
  /admin/tournaments:
    get:
      operationId: daily007AdminListTournaments
      summary: List all tournaments for administrators, including cancelled matches
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Tournament list without room credentials
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Daily007AdminTournament" }
        "403": { description: Administrator required }
  /admin/tournaments/{id}/results:
    get:
      operationId: getAdminTournamentResults
      summary: Get an administrator's saved draft or finalized results
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Draft/finalized result state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TournamentResultsView" }
        "403": { description: Administrator required }
        "404": { description: Tournament not found }
  /admin/results:
    get:
      operationId: daily007ListAdminResultLogs
      summary: List published tournament result entries
      security: [{ bearerAuth: [] }]
      parameters:
        - name: includeUnfinalized
          in: query
          required: false
          description: Include saved result entries for tournaments without a published winner.
          schema:
            type: boolean
      responses:
        "200":
          description: Published winner and placement entries with settlement details
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminResultLogsResponse" }
        "403": { description: Tournament administrator required }
    post:
      operationId: publishTournamentResult
      summary: Publish a tournament result and credit the awarded players
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TournamentResultSubmission" }
      responses:
        "201":
          description: Result published and wallet credits settled for every awarded player
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TournamentResultPublishResponse" }
        "400": { description: Invalid result entry }
        "403": { description: Tournament administrator required }
        "404": { description: Tournament or player registration not found }
        "409": { description: Result cannot be published or payout validation failed }
  /admin/results/duplicate-placements:
    get:
      operationId: daily007ListAdminDuplicatePlacements
      summary: Audit historical duplicate tournament placements
      description: Read-only report of tournament result awards where multiple registrations share the same rank.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Read-only duplicate placement audit with tournament and saved award details
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminDuplicatePlacementsResponse" }
        "403": { description: Tournament administrator required }
  /admin/results/prize-credit-audit:
    get:
      operationId: daily007ListAdminPrizeCreditAudit
      summary: Audit match prize credits against saved tournament results
      description: Read-only report of match-prize ledger rows with missing or inconsistent result references. Candidate awards require the same player, exact prize amount, and transaction timestamp.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Prize-credit reference audit with candidate classifications
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminPrizeCreditAuditResponse" }
        "403": { description: Tournament administrator required }
  /admin/tournaments/{id}/confirm-results:
    post:
      operationId: confirmTournamentResults
      summary: Finalize saved results and distribute each reward exactly once
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Results finalized and rewards processed }
        "409": { description: "Draft is missing, already finalized, or invalid" }
        "403": { description: Administrator required }
        "404": { description: Tournament not found }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    clerkBearerAuth:
      type: http
      scheme: bearer
  schemas:
    Daily007AdminTournament:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        mode: { type: string }
        gameMode: { type: string }
        teamType: { type: string }
        teamSize: { type: integer }
        slotUnit: { type: string, enum: [player, team] }
        date: { type: string }
        time: { type: string }
        startsAt: { type: string, format: date-time }
        completedAt: { type: ["string", "null"], format: date-time }
        entryCoins: { type: integer }
        prizePool: { type: integer }
        totalSlots: { type: integer }
        totalPlayerSlots: { type: integer }
        rules: { type: string }
        banner: { type: string }
        imageUrl: { type: ["string", "null"] }
        prizeDist: { type: string }
        enabled: { type: boolean }
        status: { type: string }
        filledSlots: { type: integer }
        filledPlayerSlots: { type: integer }
        availableSlots: { type: integer }
        capacityLabel: { type: string }
        roomPublished: { type: boolean }
      required:
        - id
        - name
        - mode
        - gameMode
        - teamType
        - teamSize
        - slotUnit
        - date
        - time
        - startsAt
        - completedAt
        - entryCoins
        - prizePool
        - totalSlots
        - totalPlayerSlots
        - rules
        - banner
        - imageUrl
        - prizeDist
        - enabled
        - status
        - filledSlots
        - filledPlayerSlots
        - availableSlots
        - capacityLabel
        - roomPublished
    TournamentLifecycleUpdate:
      type: object
      additionalProperties: false
      properties:
        status: { type: string, enum: [cancelled] }
      required: [status]
    TournamentResultSubmission:
      type: object
      additionalProperties: false
      properties:
        tournamentId: { type: string, format: uuid }
        registrationId:
          type: string
          format: uuid
          description: For a team-based rank-1 result, an approved registration identifies the winning team; the server awards its active approved registered players.
        rank: { type: integer, minimum: 1, maximum: 2147483647 }
        kills:
          type: integer
          minimum: 0
          maximum: 2147483647
          description: Individual kills for a single-player result; team rank-1 awards record zero so personal kill totals remain unchanged.
      required: [tournamentId, registrationId, rank, kills]
    TournamentPrizeRecipient:
      type: object
      additionalProperties: false
      properties:
        registrationId: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        prizeCoins: { type: integer, minimum: 0 }
        walletCoins: { type: integer, minimum: 0 }
      required: [registrationId, userId, prizeCoins, walletCoins]
    TournamentResultPublishResponse:
      type: object
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        registrationId: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        rank: { type: integer, minimum: 1 }
        kills: { type: integer, minimum: 0 }
        prizeCoins: { type: integer, minimum: 0, description: Equal per-player prize for team wins; otherwise the saved rank prize. }
        walletCoins: { type: integer, minimum: 0 }
        totalPrizeCoins: { type: integer, minimum: 0 }
        playersAwarded:
          type: array
          items: { $ref: "#/components/schemas/TournamentPrizeRecipient" }
        teamNumber: { type: integer, minimum: 1, maximum: 24 }
      required: [id, registrationId, userId, rank, kills, prizeCoins, walletCoins, totalPrizeCoins, playersAwarded]
    TournamentResultEntry:
      type: object
      properties:
        registrationId: { type: string, format: uuid }
        rank: { type: integer }
        kills: { type: integer }
        prizeCoins: { type: integer }
        gameName: { type: string }
        teamName: { type: string, nullable: true }
      required: [registrationId, rank, kills, prizeCoins, gameName, teamName]
    TournamentResultsView:
      type: object
      properties:
        tournamentId: { type: string, format: uuid }
        status: { type: string, enum: [draft, finalized] }
        finalizedAt: { type: ["string", "null"], format: date-time }
        entries:
          type: array
          items: { $ref: "#/components/schemas/TournamentResultEntry" }
      required: [tournamentId, entries]
    AdminResultLog:
      type: object
      properties:
        tournamentId: { type: string, format: uuid }
        tournamentName: { type: string }
        registrationId: { type: string, format: uuid }
        playerName: { type: string }
        gameName: { type: ["string", "null"] }
        teamName: { type: ["string", "null"] }
        rank: { type: integer, minimum: 1 }
        kills: { type: integer, minimum: 0 }
        prizeCoins: { type: integer, minimum: 0 }
        createdAt: { type: string, format: date-time }
      required: [tournamentId, tournamentName, registrationId, playerName, rank, kills, prizeCoins, createdAt]
    AdminResultLogsResponse:
      type: object
      properties:
        success: { type: boolean }
        data:
          type: array
          items: { $ref: "#/components/schemas/AdminResultLog" }
      required: [success, data]
    AdminDuplicatePlacementAward:
      type: object
      properties:
        awardId: { type: string, format: uuid }
        registrationId: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        playerName: { type: string }
        gameName: { type: ["string", "null"] }
        teamName: { type: ["string", "null"] }
        kills: { type: integer, minimum: 0 }
        prizeCoins: { type: integer, minimum: 0 }
        createdAt: { type: string, format: date-time }
      required: [awardId, registrationId, userId, playerName, gameName, teamName, kills, prizeCoins, createdAt]
    AdminDuplicatePlacement:
      type: object
      properties:
        tournamentId: { type: string, format: uuid }
        tournamentName: { type: string }
        startsAt: { type: string, format: date-time }
        tournamentStatus: { type: string }
        prizePool: { type: integer, minimum: 0 }
        prizeDistribution: { type: string }
        rank: { type: integer, minimum: 1 }
        registrationCount: { type: integer, minimum: 2 }
        totalPrizeCoins: { type: string }
        awards:
          type: array
          items: { $ref: "#/components/schemas/AdminDuplicatePlacementAward" }
      required: [tournamentId, tournamentName, startsAt, tournamentStatus, prizePool, prizeDistribution, rank, registrationCount, totalPrizeCoins, awards]
    AdminDuplicatePlacementsResponse:
      type: object
      properties:
        success: { type: boolean }
        data:
          type: array
          items: { $ref: "#/components/schemas/AdminDuplicatePlacement" }
        correctionGuidance: { type: string }
      required: [success, data, correctionGuidance]
    AdminPrizeCreditAuditAward:
      type: object
      properties:
        awardId: { type: string, format: uuid }
        matchId: { type: string, format: uuid }
        tournamentName: { type: string }
        registrationId: { type: string, format: uuid }
        playerName: { type: string }
        gameName: { type: string }
        teamName: { type: ["string", "null"] }
        rank: { type: integer, minimum: 1 }
        prizeCoins: { type: integer, minimum: 0 }
        createdAt: { type: string, format: date-time }
      required: [awardId, matchId, tournamentName, registrationId, playerName, gameName, teamName, rank, prizeCoins, createdAt]
    AdminPrizeCreditAuditEntry:
      type: object
      properties:
        ledgerId: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        playerName: { type: string }
        amount: { type: integer }
        balanceAfter: { type: integer }
        createdAt: { type: string, format: date-time }
        matchId: { type: ["string", "null"], format: uuid }
        registrationId: { type: ["string", "null"], format: uuid }
        referenceIssues:
          type: array
          items:
            type: string
            enum:
              - missing_match_reference
              - missing_registration_reference
              - registration_belongs_to_different_match
              - no_saved_award_for_registration
              - award_match_mismatch
              - player_mismatch
              - prize_amount_mismatch
              - transaction_timestamp_mismatch
        candidateStatus: { type: string, enum: [unique, ambiguous, unmatched] }
        candidateCount: { type: integer, minimum: 0 }
        candidates:
          type: array
          items: { $ref: "#/components/schemas/AdminPrizeCreditAuditAward" }
        referencedResult:
          oneOf:
            - { $ref: "#/components/schemas/AdminPrizeCreditAuditAward" }
            - { type: "null" }
      required: [ledgerId, userId, playerName, amount, balanceAfter, createdAt, matchId, registrationId, referenceIssues, candidateStatus, candidateCount, candidates, referencedResult]
    AdminPrizeCreditAuditResponse:
      type: object
      properties:
        success: { type: boolean }
        data:
          type: array
          items: { $ref: "#/components/schemas/AdminPrizeCreditAuditEntry" }
      required: [success, data]
    TournamentSlot:
      type: object
      properties:
        number: { type: integer, minimum: 1 }
        status: { type: string, enum: [available, taken, locked] }
        teamName: { type: ["string", "null"] }
      required: [number, status]
    TournamentParticipant:
      type: object
      properties:
        groupNumber:
          type: ["integer", "null"]
          minimum: 1
          description: Persistent team or player-slot group assignment for an active registration.
        teamName: { type: ["string", "null"] }
        players:
          type: array
          items: { type: string }
          description: Free Fire in-game names, with the captain first.
        status: { type: string, enum: [approved, pending] }
      required: [groupNumber, teamName, players, status]
    TournamentParticipantsResponse:
      type: object
      properties:
        tournamentId: { type: string, format: uuid }
        participants:
          type: array
          items: { $ref: "#/components/schemas/TournamentParticipant" }
      required: [tournamentId, participants]
    Daily007V2SquadJoinBody:
      type: object
      additionalProperties: false
      properties:
        teamNumber: { type: integer, minimum: 1, maximum: 24 }
        slotNumber: { type: integer, minimum: 1, maximum: 4 }
        gameName: { type: string, minLength: 1, maxLength: 100 }
        gameUid: { type: string, minLength: 1, maxLength: 128 }
      required: [teamNumber, slotNumber, gameName, gameUid]
    Daily007V2SquadSlot:
      type: object
      properties:
        slotNumber: { type: integer, minimum: 1, maximum: 4 }
        occupied: { type: boolean }
        gameName: { type: ["string", "null"] }
        isCaptain: { type: boolean }
        canJoin: { type: boolean }
        canRemove: { type: boolean }
        registrationId: { type: ["string", "null"], format: uuid }
      required: [slotNumber, occupied, gameName, isCaptain, canJoin, canRemove, registrationId]
    Daily007V2SquadTeam:
      type: object
      properties:
        teamNumber: { type: integer, minimum: 1, maximum: 24 }
        legacy: { type: boolean }
        captainGameName: { type: ["string", "null"] }
        slots:
          type: array
          minItems: 1
          maxItems: 4
          items: { $ref: "#/components/schemas/Daily007V2SquadSlot" }
      required: [teamNumber, legacy, captainGameName, slots]
    Daily007V2SquadSlotsResponse:
      type: object
      properties:
        tournamentId: { type: string, format: uuid }
        teamSize: { type: integer, minimum: 2, maximum: 4 }
        capacity: { type: integer, minimum: 2, maximum: 24 }
        filledTeams: { type: integer, minimum: 0, maximum: 24 }
        filledPlayers: { type: integer, minimum: 0, maximum: 96 }
        registrationClosed: { type: boolean }
        alreadyRegistered: { type: boolean }
        myTeamNumber: { type: ["integer", "null"] }
        mySlotNumber: { type: ["integer", "null"] }
        teams:
          type: array
          minItems: 2
          maxItems: 24
          items: { $ref: "#/components/schemas/Daily007V2SquadTeam" }
      required: [tournamentId, teamSize, capacity, filledTeams, filledPlayers, registrationClosed, alreadyRegistered, myTeamNumber, mySlotNumber, teams]
    Daily007V2SquadJoinResponse:
      type: object
      properties:
        registrationId: { type: string, format: uuid }
        teamNumber: { type: integer, minimum: 1, maximum: 24 }
        slotNumber: { type: integer, minimum: 1, maximum: 4 }
        isCaptain: { type: boolean }
        entryCoinsPaid: { type: integer, minimum: 0 }
        walletCoins: { type: integer, minimum: 0 }
        filledTeams: { type: integer, minimum: 0, maximum: 24 }
        filledPlayers: { type: integer, minimum: 0, maximum: 96 }
        alreadyRegistered: { type: boolean }
      required: [registrationId, teamNumber, slotNumber, isCaptain, entryCoinsPaid, walletCoins, filledTeams, filledPlayers, alreadyRegistered]
    Daily007V2SquadRemovalResponse:
      type: object
      properties:
        teamNumber: { type: integer, minimum: 1, maximum: 12 }
        slotNumber: { type: integer, minimum: 1, maximum: 4 }
        refunded: { type: boolean, const: false }
        message: { type: string }
      required: [teamNumber, slotNumber, refunded, message]
    TournamentSlotsResponse:
      type: object
      properties:
        tournamentId: { type: string, format: uuid }
        mode: { type: string, enum: [solo, squad, clash] }
        capacity: { type: integer }
        filledCount: { type: integer }
        playersCount: { type: integer }
        slots:
          type: array
          items: { $ref: "#/components/schemas/TournamentSlot" }
      required: [tournamentId, mode, capacity, filledCount, playersCount, slots]
    Daily007V2CreateMatchBody:
      type: object
      additionalProperties: false
      properties:
        title: { type: string, minLength: 1, maxLength: 100 }
        mode: { type: string, enum: [solo, squad, clash] }
        startsAt:
          type: string
          format: date-time
          description: Must be a valid ISO timestamp strictly in the future.
        entryCoins: { type: integer, minimum: 0, maximum: 2147483647 }
      required: [title, mode, startsAt]
    Daily007V2UpdateMatchBody:
      type: object
      description: Include entryCoins and/or startsAt. If supplied, startsAt must be a valid future ISO timestamp; past matches cannot be updated.
      additionalProperties: false
      properties:
        startsAt: { type: string, format: date-time }
        entryCoins: { type: integer, minimum: 0, maximum: 2147483647 }
      minProperties: 1
    Daily007V2RegistrationBody:
      type: object
      additionalProperties: false
      properties:
        captainName: { type: string, minLength: 1, maxLength: 100 }
        captainGameName: { type: string, minLength: 1, maxLength: 100 }
        captainGameUid: { type: string, minLength: 1, maxLength: 128 }
        seatGroupNumber:
          type: integer
          minimum: 1
          description: Optional exact team/player slot group. When omitted, the API assigns the first available group.
        teammates:
          type: array
          minItems: 0
          maxItems: 3
          description: The server validates the exact teammate count for the selected tournament mode. Each supplied teammate name is required; UID is optional.
          items:
            type: object
            additionalProperties: false
            properties:
              name: { type: string, minLength: 1, maxLength: 100 }
              uid:
                anyOf:
                  - { type: string, minLength: 1, maxLength: 128 }
                  - { type: "null" }
            required: [name]
      required: [captainName, captainGameName, captainGameUid]
    Daily007V2RegistrationResponse:
      type: object
      properties:
        registrationId: { type: string, format: uuid }
        seatGroupNumber:
          type: ["integer", "null"]
          minimum: 1
          description: Persisted team or player-slot group number.
        entryCoinsPaid: { type: integer, minimum: 0 }
        walletCoins: { type: integer, minimum: 0 }
        registeredCount: { type: integer, minimum: 0 }
        capacity: { type: integer, minimum: 1 }
        isFull: { type: boolean }
        alreadyRegistered: { type: boolean }
      required: [registrationId, seatGroupNumber, entryCoinsPaid, walletCoins, registeredCount, capacity, isFull, alreadyRegistered]
    Daily007GoogleSignInBody:
