<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
    <title>Daily007 registration large-text preview</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }

      body {
        display: flex;
        flex-direction: column;
        background: #070a12;
        font-family: Arial, sans-serif;
      }

      #root {
        display: flex;
        flex: 1;
        flex-direction: column;
        min-height: 0;
      }
    </style>
    <script>
      class PreviewExpoEventEmitter {
        constructor() {
          this.listeners = new Map();
        }
        addListener(eventName, listener) {
          const listeners = this.listeners.get(eventName) ?? new Set();
          listeners.add(listener);
          this.listeners.set(eventName, listeners);
          return { remove: () => listeners.delete(listener) };
        }
        removeListener(eventName, listener) {
          this.listeners.get(eventName)?.delete(listener);
        }
        removeAllListeners(eventName) {
          if (eventName) this.listeners.delete(eventName);
          else this.listeners.clear();
        }
        emit(eventName, ...args) {
          for (const listener of this.listeners.get(eventName) ?? []) listener(...args);
        }
      }
      window.expo = window.expo ?? {};
      window.expo.EventEmitter = window.expo.EventEmitter ?? PreviewExpoEventEmitter;
      window.expo.NativeModule = window.expo.NativeModule
        ?? class PreviewExpoNativeModule extends PreviewExpoEventEmitter {};
      window.expo.modules = window.expo.modules ?? {};
      window.__daily007LargeTextScale = 2;
      window.__joinFormCancelCount = 0;
      window.require = () => ({ default: null });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/admin-narrow/player-join-form-largest-text-main.jsx"></script>
  </body>
</html>
