appId: host.exp.exponent
---
- openLink:
    link: ${EXPO_DEV_URL}/--/home-match-back-test
- repeat:
    times: 12
    while:
      notVisible:
        id: home-match-back-test-fixture
    commands:
      - runFlow:
          when:
            visible: "Pixel Launcher isn't responding"
          commands:
            - tapOn:
                id: android:id/aerr_close
      - tapOn:
          id: android:id/aerr_wait
          optional: true
          waitUntilVisible: true
      - tapOn:
          text: Continue
          optional: true
          waitUntilVisible: true
      - runFlow:
          when:
            visible: Open React Native dev menu
          commands:
            - pressKey: BACK
      - runFlow:
          when:
            visible: Continue
          commands:
            - pressKey: BACK
      - runFlow:
          when:
            visible: Reload
          commands:
            - pressKey: BACK
- extendedWaitUntil:
    visible:
      id: home-match-back-test-fixture
    timeout: 60000
- extendedWaitUntil:
    visible:
      id: home-upcoming-carousel
    timeout: 30000
- scrollUntilVisible:
    element:
      id: home-upcoming-card-home-back-match-one
    direction: UP
    timeout: 15000
- extendedWaitUntil:
    visible:
      id: home-upcoming-card-home-back-match-one
    timeout: 15000
- tapOn:
    id: home-upcoming-card-home-back-match-one
- extendedWaitUntil:
    visible: "Home Back Test Match One"
    timeout: 10000
- pressKey: BACK
- extendedWaitUntil:
    visible:
      id: home-upcoming-card-home-back-match-one
    timeout: 10000
- swipe:
    start: 88%, 55%
    end: 12%, 55%
    duration: 700
- extendedWaitUntil:
    visible:
      id: home-upcoming-card-home-back-match-two
    timeout: 15000
- tapOn:
    id: home-upcoming-card-home-back-match-two
- extendedWaitUntil:
    visible: "Home Back Test Match Two"
    timeout: 10000
- pressKey: BACK
- extendedWaitUntil:
    visible:
      id: home-upcoming-card-home-back-match-two
    timeout: 10000
- assertVisible:
    id: home-upcoming-card-home-back-match-two
