appId: host.exp.exponent
---
- openLink:
    link: ${EXPO_DEV_URL}/--/join-form-accessibility-test
- extendedWaitUntil:
    visible:
      id: join-form-accessibility-fixture
    timeout: 15000

- tapOn:
    id: join-form-accessibility-select-solo
- assertVisible:
    text: "Current format: Solo"
- scrollUntilVisible:
    element:
      text: "PLAYER 1 Free Fire in-game name"
    direction: DOWN
- tapOn:
    text: "PLAYER 1 Free Fire in-game name"
- hideKeyboard
- scrollUntilVisible:
    element:
      text: "PLAYER 1 Free Fire UID"
    direction: DOWN
- tapOn:
    text: "PLAYER 1 Free Fire UID"
- hideKeyboard

- scrollUntilVisible:
    element:
      id: join-form-accessibility-select-duo
    direction: UP
- tapOn:
    id: join-form-accessibility-select-duo
- assertVisible:
    text: "Current format: Duo"
- scrollUntilVisible:
    element:
      text: "PLAYER 2 Free Fire in-game name"
    direction: DOWN
- tapOn:
    text: "PLAYER 2 Free Fire in-game name"
- hideKeyboard
- scrollUntilVisible:
    element:
      text: "PLAYER 2 Free Fire UID"
    direction: DOWN
- tapOn:
    text: "PLAYER 2 Free Fire UID"
- hideKeyboard

- scrollUntilVisible:
    element:
      id: join-form-accessibility-select-squad
    direction: UP
- tapOn:
    id: join-form-accessibility-select-squad
- assertVisible:
    text: "Current format: Squad"
- scrollUntilVisible:
    element:
      text: "PLAYER 2 Free Fire in-game name"
    direction: DOWN
- tapOn:
    text: "PLAYER 2 Free Fire in-game name"
- hideKeyboard
- scrollUntilVisible:
    element:
      text: "PLAYER 2 Free Fire UID"
    direction: DOWN
- tapOn:
    text: "PLAYER 2 Free Fire UID"
- hideKeyboard
