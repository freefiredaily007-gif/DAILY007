appId: host.exp.exponent
---
- openLink:
    link: ${EXPO_DEV_URL}/--/join-form-accessibility-test
- repeat:
    times: 12
    while:
      notVisible:
        id: join-form-accessibility-fixture
    commands:
      - runFlow:
          when:
            visible: "Pixel Launcher isn't responding"
          commands:
            - tapOn:
                id: android:id/aerr_close
      - tapOn:
          id: android:id/aerr_wait
          optional: true
          waitUntilVisible: true
      - tapOn:
          text: Continue
          optional: true
          waitUntilVisible: true
      - runFlow:
          when:
            visible: Open React Native dev menu
          commands:
            - pressKey: BACK
      - runFlow:
          when:
            visible: Continue
          commands:
            - pressKey: BACK
      - runFlow:
          when:
            visible: Reload
          commands:
            - pressKey: BACK
- extendedWaitUntil:
    visible:
      id: join-form-accessibility-fixture
    timeout: 60000

- tapOn:
    id: join-form-accessibility-select-solo
- assertVisible:
    text: "Current format: Solo"
- scrollUntilVisible:
    element:
      text: "PLAYER 1 Free Fire in-game name"
    direction: DOWN
- tapOn:
    text: "PLAYER 1 Free Fire in-game name"
- hideKeyboard
- scrollUntilVisible:
    element:
      text: "PLAYER 1 Free Fire UID"
    direction: DOWN
- tapOn:
    text: "PLAYER 1 Free Fire UID"
- hideKeyboard

- scrollUntilVisible:
    element:
      id: join-form-accessibility-select-duo
    direction: UP
- tapOn:
    id: join-form-accessibility-select-duo
- assertVisible:
    text: "Current format: Duo"
- scrollUntilVisible:
    element:
      text: "PLAYER 2 Free Fire in-game name"
    direction: DOWN
- tapOn:
    text: "PLAYER 2 Free Fire in-game name"
- hideKeyboard
- scrollUntilVisible:
    element:
      text: "PLAYER 2 Free Fire UID"
    direction: DOWN
- tapOn:
    text: "PLAYER 2 Free Fire UID"
- hideKeyboard

- scrollUntilVisible:
    element:
      id: join-form-accessibility-select-trio
    direction: UP
- tapOn:
    id: join-form-accessibility-select-trio
- assertVisible:
    text: "Current format: Trio"
- scrollUntilVisible:
    element:
      text: "PLAYER 2 Free Fire in-game name"
    direction: DOWN
- tapOn:
    text: "PLAYER 2 Free Fire in-game name"
- hideKeyboard
- scrollUntilVisible:
    element:
      text: "PLAYER 2 Free Fire UID"
    direction: DOWN
- tapOn:
    text: "PLAYER 2 Free Fire UID"
- hideKeyboard

- scrollUntilVisible:
    element:
      id: join-form-accessibility-select-squad
    direction: UP
- tapOn:
    id: join-form-accessibility-select-squad
- assertVisible:
    text: "Current format: Squad"
- scrollUntilVisible:
    element:
      text: "PLAYER 2 Free Fire in-game name"
    direction: DOWN
- tapOn:
    text: "PLAYER 2 Free Fire in-game name"
- hideKeyboard
- scrollUntilVisible:
    element:
      text: "PLAYER 2 Free Fire UID"
    direction: DOWN
- tapOn:
    text: "PLAYER 2 Free Fire UID"
- hideKeyboard
