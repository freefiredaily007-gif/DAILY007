appId: host.exp.exponent
---
- openLink:
    link: ${EXPO_DEV_URL}/--/join-form-accessibility-test
- extendedWaitUntil:
    visible:
      id: join-form-accessibility-fixture
    timeout: 15000

- tapOn:
    id: join-form-accessibility-select-solo
- assertVisible:
    text: "Current format: Solo"
- scrollUntilVisible:
    element:
      text: "Captain Daily007 profile name, read-only"
    direction: DOWN
- assertVisible:
    text: "Captain Daily007 profile name, read-only"
- tapOn:
    text: "Captain Daily007 profile name, read-only"
- scrollUntilVisible:
    element:
      text: "Captain Free Fire in-game name"
    direction: DOWN
- tapOn:
    text: "Captain Free Fire in-game name"
- hideKeyboard
- scrollUntilVisible:
    element:
      text: "Captain Free Fire UID"
    direction: DOWN
- tapOn:
    text: "Captain Free Fire UID"
- hideKeyboard

