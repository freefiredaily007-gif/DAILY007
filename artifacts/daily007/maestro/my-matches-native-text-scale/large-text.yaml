appId: host.exp.exponent
---
- openLink:
    link: ${EXPO_DEV_URL}/--/my-matches-native-text-scale-test
- extendedWaitUntil:
    visible:
      id: my-matches-text-scale-banner
    timeout: 15000
- assertVisible:
    text: "My Matches result fixture · font scale 1.50"
- extendedWaitUntil:
    visible:
      text: "All 10 result rows wrap within bounds at 1.50×"
    timeout: 15000

- scrollUntilVisible:
