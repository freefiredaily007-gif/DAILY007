appId: host.exp.exponent
---
- openLink:
    link: ${EXPO_DEV_URL}/--/wallet-cancellation-refund-test
# Expo Go can show delayed startup prompts and background Pixel Launcher ANRs.
- repeat:
    times: 12
    while:
      notVisible:
        id: wallet-cancellation-refund-fixture-banner
    commands:
      - runFlow:
          when:
            visible: "Pixel Launcher isn't responding"
          commands:
            - tapOn:
                id: android:id/aerr_close
      - tapOn:
          id: android:id/aerr_wait
          optional: true
          waitUntilVisible: true
      - tapOn:
          text: Continue
          optional: true
          waitUntilVisible: true
      - runFlow:
          when:
            visible: Open React Native dev menu
          commands:
            - pressKey: BACK
      - runFlow:
          when:
            visible: Continue
          commands:
            - pressKey: BACK
      - runFlow:
          when:
            visible: Reload
          commands:
            - pressKey: BACK
- extendedWaitUntil:
    visible:
      id: wallet-cancellation-refund-fixture-banner
    timeout: 60000
- assertVisible:
    text: "Cancellation refund fixture · font scale 1.5"
- assertVisible:
    id: wallet-cancellation-refund-row
- assertVisible:
    text: "Entry fee refunded — Legacy Clash Cup (tournament cancelled). +27 coins credited. Date: 2030-02-03 10:20. Balance after: 155 coins."
- assertVisible:
    id: wallet-cancellation-refund-large-text-result
- assertVisible:
    text: "Every refund detail is visible without clipping or overlap at 1.5×"
