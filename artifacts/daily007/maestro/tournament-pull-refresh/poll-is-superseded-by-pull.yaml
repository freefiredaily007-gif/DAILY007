appId: host.exp.exponent
---
- openLink:
    link: ${EXPO_DEV_URL}/--/tournament-pull-refresh-test
- repeat:
    times: 12
    while:
      notVisible:
        id: tournament-pull-refresh-fixture
    commands:
      - runFlow:
          when:
            visible: "Pixel Launcher isn't responding"
          commands:
            - tapOn:
                id: android:id/aerr_close
      - tapOn:
          id: android:id/aerr_wait
          optional: true
          waitUntilVisible: true
      - tapOn:
          text: Continue
          optional: true
          waitUntilVisible: true
      - runFlow:
          when:
            visible: Open React Native dev menu
          commands:
            - pressKey: BACK
      - runFlow:
          when:
            visible: Continue
          commands:
            - pressKey: BACK
      - runFlow:
          when:
            visible: Reload
          commands:
            - pressKey: BACK
- extendedWaitUntil:
    visible:
      id: tournament-pull-refresh-fixture
    timeout: 60000
- assertVisible: "Initial tournament 1"
- extendedWaitUntil:
    visible: "Scheduled poll response pending"
    timeout: 45000
- swipe:
    start: 50%, 40%
    end: 50%, 82%
    duration: 900
- extendedWaitUntil:
    visible: "Manual response pending"
    timeout: 10000
- tapOn:
    id: tournament-pull-refresh-resolve-manual
- extendedWaitUntil:
    visible: "Newest pull result"
    timeout: 10000
- tapOn:
    id: tournament-pull-refresh-resolve-poll
- extendedWaitUntil:
    visible: "Scheduled poll response released"
    timeout: 10000
- assertVisible: "Newest pull result"
- assertNotVisible: "Stale poll result"
