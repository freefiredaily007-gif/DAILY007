appId: host.exp.exponent
---
- openLink:
    link: ${EXPO_DEV_URL}/--/home-mode-native-text-scale-test
- repeat:
    times: 12
    while:
      notVisible:
        id: home-mode-text-scale-banner
    commands:
      - runFlow:
          when:
            visible: "Pixel Launcher isn't responding"
          commands:
            - tapOn:
                id: android:id/aerr_close
      - tapOn:
          id: android:id/aerr_wait
          optional: true
          waitUntilVisible: true
      - tapOn:
          text: Continue
          optional: true
          waitUntilVisible: true
      - runFlow:
          when:
            visible: Open React Native dev menu
          commands:
            - pressKey: BACK
      - runFlow:
          when:
            visible: Continue
          commands:
            - pressKey: BACK
      - runFlow:
          when:
            visible: Reload
          commands:
            - pressKey: BACK
- extendedWaitUntil:
    visible:
      id: home-mode-text-scale-banner
    timeout: 60000
- assertVisible:
    text: "Home game-mode fixture | font scale 2.00"
- extendedWaitUntil:
    visible:
      text: "Home labels fit their available width at 2×"
    timeout: 15000

- scrollUntilVisible:
    element:
      id: home-mode-battle-royale
    direction: DOWN
    centerElement: true
- assertVisible:
    text: "BATTLE ROYALE"
- tapOn:
    id: home-mode-battle-royale
- assertVisible:
    text: "Filtered tournaments: Battle Royale"
- assertVisible:
    text: "Game mode filter: battle_royale"
- tapOn:
    id: home-mode-destination-back

- scrollUntilVisible:
    element:
      id: home-mode-clash-squad
    direction: DOWN
    centerElement: true
- assertVisible:
    text: "CLASH SQUAD"
- tapOn:
    id: home-mode-clash-squad
- assertVisible:
    text: "Filtered tournaments: Clash Squad"
- assertVisible:
    text: "Game mode filter: clash_squad"
- tapOn:
    id: home-mode-destination-back

- scrollUntilVisible:
    element:
      id: home-mode-lone-wolf
    direction: DOWN
    centerElement: true
- assertVisible:
    text: "LONE WOLF"
- tapOn:
    id: home-mode-lone-wolf
- assertVisible:
    text: "Filtered tournaments: Lone Wolf"
- assertVisible:
    text: "Game mode filter: lone_wolf"
- tapOn:
    id: home-mode-destination-back

- scrollUntilVisible:
    element:
      id: home-mode-battle-royale-kill-earn
    direction: DOWN
    centerElement: true
- assertVisible:
    text: "BATTLE ROYALE KILL & EARN"
- tapOn:
    id: home-mode-battle-royale-kill-earn
- assertVisible:
    text: "Filtered tournaments: Battle Royale Kill & Earn"
- assertVisible:
    text: "Game mode filter: battle_royale_kill_earn"
