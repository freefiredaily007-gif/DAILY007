appId: host.exp.exponent
---
- openLink:
    link: ${EXPO_DEV_URL}/--/wallet-payment-history-test
- extendedWaitUntil:
    visible:
      id: wallet-payment-history-fixture-banner
    timeout: 15000
- assertVisible: "Test account with 45 payment requests"
- assertVisible: "Loaded 20 of 45 requests; unique and newest-first"
- assertVisible:
    id: wallet-transaction-pay-android-wallet-history-045
- scrollUntilVisible:
    element:
      id: wallet-load-older-transactions
    direction: DOWN
    timeout: 30000
- tapOn:
    id: wallet-load-older-transactions
- extendedWaitUntil:
    visible: "Loaded 40 of 45 requests; unique and newest-first"
    timeout: 15000
- scrollUntilVisible:
    element:
      id: wallet-load-older-transactions
    direction: DOWN
    timeout: 30000
- tapOn:
    id: wallet-load-older-transactions
- extendedWaitUntil:
    visible: "Loaded 45 of 45 requests; unique and newest-first"
    timeout: 15000
- scrollUntilVisible:
    element:
      id: wallet-transaction-pay-android-wallet-history-001
    direction: DOWN
    timeout: 30000
- assertVisible:
    id: wallet-transaction-pay-android-wallet-history-001
- assertNotVisible:
    id: wallet-load-older-transactions
