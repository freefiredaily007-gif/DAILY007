appId: host.exp.exponent
---
- openLink:
    link: ${EXPO_DEV_URL}/--/withdrawal-upi-copy-test
- extendedWaitUntil:
    visible:
      id: copy-withdrawal-upi-withdrawal-upi-copy-fixture
    timeout: 15000
- tapOn:
    id: copy-withdrawal-upi-withdrawal-upi-copy-fixture
- extendedWaitUntil:
    visible:
      text: ".*Withdrawal UPI ID copied.*"
    timeout: 10000
- tapOn:
    id: withdrawal-upi-paste-destination-1
- longPressOn:
    id: withdrawal-upi-paste-destination-1
- tapOn:
    text: "Paste"
- extendedWaitUntil:
    visible:
      text: "First fixture pasted value matches exactly"
    timeout: 10000
- hideKeyboard
- scrollUntilVisible:
    element:
      id: copy-withdrawal-upi-withdrawal-upi-copy-fixture-long
    direction: DOWN
    timeout: 15000
- tapOn:
    id: copy-withdrawal-upi-withdrawal-upi-copy-fixture-long
- extendedWaitUntil:
    visible:
      text: ".*Withdrawal UPI ID copied.*"
    timeout: 10000
- tapOn:
    id: withdrawal-upi-paste-destination-2
- longPressOn:
    id: withdrawal-upi-paste-destination-2
- tapOn:
    text: "Paste"
- extendedWaitUntil:
    visible:
      text: "Longer fixture pasted value matches exactly"
    timeout: 10000
