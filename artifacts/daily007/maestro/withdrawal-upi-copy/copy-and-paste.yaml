appId: host.exp.exponent
---
- openLink:
    link: ${EXPO_DEV_URL}/--/withdrawal-upi-copy-test
- extendedWaitUntil:
    visible:
      id: copy-withdrawal-upi-withdrawal-upi-copy-fixture
    timeout: 15000
- tapOn:
    text: "Minimize"
    optional: true
- tapOn:
    id: copy-withdrawal-upi-withdrawal-upi-copy-fixture
- extendedWaitUntil:
    visible:
      text: ".*Withdrawal UPI ID copied.*"
    timeout: 10000
- tapOn:
    text: "Minimize"
    optional: true
- scrollUntilVisible:
    element:
      id: withdrawal-upi-clipboard-check-1
    direction: DOWN
    centerElement: true
    timeout: 15000
- tapOn:
    id: withdrawal-upi-clipboard-check-1
- tapOn:
    text: "Minimize"
    optional: true
- tapOn:
    id: withdrawal-upi-clipboard-check-1
- extendedWaitUntil:
    visible:
      text: "First fixture clipboard value matches exactly"
    timeout: 10000
- scrollUntilVisible:
    element:
      id: copy-withdrawal-upi-withdrawal-upi-copy-fixture-long
    direction: DOWN
    centerElement: true
    timeout: 15000
- tapOn:
    id: copy-withdrawal-upi-withdrawal-upi-copy-fixture-long
- extendedWaitUntil:
    visible:
      text: ".*Withdrawal UPI ID copied.*"
    timeout: 10000
- tapOn:
    text: "Minimize"
    optional: true
- scrollUntilVisible:
    element:
      id: withdrawal-upi-clipboard-check-2
    direction: DOWN
    centerElement: true
    timeout: 15000
- tapOn:
    id: withdrawal-upi-clipboard-check-2
- tapOn:
    text: "Minimize"
    optional: true
- tapOn:
    id: withdrawal-upi-clipboard-check-2
- extendedWaitUntil:
    visible:
      text: "Longer fixture clipboard value matches exactly"
    timeout: 10000
