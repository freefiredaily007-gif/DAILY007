appId: host.exp.Exponent
---
- openLink:
    link: ${EXPO_DEV_URL}/--/wallet-admin-credit-refund-test
# Expo Go can leave its developer menu or an emulator startup prompt above the
# fixture after each suite force-stops the app.
- repeat:
    times: 12
    while:
      notVisible:
        id: wallet-credit-refund-fixture-banner
    commands:
      - runFlow:
          when:
            visible: "Pixel Launcher isn't responding"
          commands:
            - tapOn:
                id: android:id/aerr_close
      - tapOn:
          id: android:id/aerr_wait
          optional: true
          waitUntilVisible: true
      - tapOn:
          text: Continue
          optional: true
          waitUntilVisible: true
      - runFlow:
          when:
            visible: Open React Native dev menu
          commands:
            - pressKey: BACK
      - runFlow:
          when:
            visible: Continue
          commands:
            - pressKey: BACK
      - runFlow:
          when:
            visible: Reload
          commands:
            - pressKey: BACK
- extendedWaitUntil:
    visible:
      id: wallet-credit-refund-fixture-banner
    timeout: 60000
- assertVisible:
    id: wallet-credit-refund-verification
- assertVisible:
    text: "Wallet loaded one separate manual credit and one cancellation refund"
- assertVisible:
    id: wallet-transaction-manual-credit
- assertVisible:
    text: "Admin wallet adjustment — entry fee correction"
- assertVisible:
    text: "+12"
- assertVisible:
    id: wallet-cancellation-refund-row
- assertVisible:
    text: "Entry fee refunded — Entry Fee Correction Cup (tournament cancelled). +25 coins credited. Date: 2030-02-03 10:21. Balance after: 137 coins."
