appId: host.exp.exponent
---
- openLink:
    link: ${EXPO_DEV_URL}/--/profile-text-scale-test
- extendedWaitUntil:
    visible:
      id: profile-text-scale-banner
    timeout: 15000
- assertVisible:
    text: "Profile text scale fixture · font scale 2.00"
- extendedWaitUntil:
    visible:
      text: "Profile key text fits available widths at 2.00×"
    timeout: 15000
- assertVisible:
    id: profile-text-scale-name
- assertVisible:
    id: profile-text-scale-email
- assertVisible:
    id: profile-text-scale-game-uid
- scrollUntilVisible:
    element:
      text: "123456 matches"
    direction: DOWN
    centerElement: true
- assertVisible:
    text: "123456 matches"
- scrollUntilVisible:
    element:
      text: "9876 wins"
    direction: DOWN
    centerElement: true
- assertVisible:
    text: "9876 wins"

- scrollUntilVisible:
    element:
      id: profile-change-password
    direction: DOWN
    centerElement: true
- tapOn:
    id: profile-change-password
- extendedWaitUntil:
    visible:
      id: profile-password-cancel
    timeout: 10000
- assertVisible:
    text: "CHANGE PASSWORD"
- scrollUntilVisible:
    element:
      text: "Current Daily007 password"
    direction: DOWN
    centerElement: true
- assertVisible:
    text: "Current Daily007 password"
- scrollUntilVisible:
    element:
      id: profile-password-submit
    direction: DOWN
    centerElement: true
- scrollUntilVisible:
    element:
      id: profile-password-cancel
    direction: DOWN
    centerElement: true
- tapOn:
    id: profile-password-cancel
