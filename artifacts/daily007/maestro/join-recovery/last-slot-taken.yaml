appId: host.exp.exponent
---
- openLink:
    link: ${EXPO_DEV_URL}/--/join-recovery-test
# Expo Go's bundle progress is not consistently exposed to Maestro's UI tree.
# Retry startup prompts and close the native dev menu until the route is accessible.
- repeat:
    times: 12
    while:
      notVisible:
        id: join-recovery-fixture-banner
    commands:
      - tapOn:
          id: android:id/aerr_wait
          optional: true
      - tapOn:
          text: Continue
          optional: true
          waitUntilVisible: true
      - runFlow:
          when:
            visible: Continue
          commands:
            - pressKey: BACK
      - runFlow:
          when:
            visible: Reload
          commands:
            - pressKey: BACK
- extendedWaitUntil:
    visible:
      id: join-recovery-fixture-banner
    timeout: 60000
- tapOn:
    id: join-recovery-scenario-last-slot
- assertVisible:
    text: "47/48 players"
- scrollUntilVisible:
    element:
      id: join-form-player-game-name
    direction: DOWN
    centerElement: true
- tapOn:
    id: join-form-player-game-name
- inputText: "Native Test Player"
- scrollUntilVisible:
    element:
      id: join-form-player-game-uid
    direction: DOWN
    centerElement: true
- tapOn:
    id: join-form-player-game-uid
- inputText: "987654321"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: join-form-submit
    direction: DOWN
- tapOn:
    id: join-form-submit
- extendedWaitUntil:
    visible:
      id: join-form-error
    timeout: 10000
- assertVisible:
    text: ".*This match is already full and is not accepting registrations.*"
- scrollUntilVisible:
    element:
      text: "48/48 players"
    direction: UP
- assertVisible:
    text: "48/48 players"
- assertVisible:
    text: "Submit attempts: 1"
- assertNotVisible:
    id: join-recovery-confirmation
- assertNotVisible: "Registration confirmed"
