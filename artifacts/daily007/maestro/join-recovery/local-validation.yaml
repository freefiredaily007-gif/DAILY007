appId: host.exp.exponent
---
- openLink:
    link: ${EXPO_DEV_URL}/--/join-recovery-test
# Expo Go's bundle progress is not consistently exposed to Maestro's UI tree.
# Retry the optional system and Expo Go prompts until the route is accessible.
- repeat:
    times: 8
    while:
      notVisible:
        id: join-recovery-fixture-banner
    commands:
      - tapOn:
          id: android:id/aerr_wait
          optional: true
          waitUntilVisible: true
      - tapOn:
          text: Continue
          optional: true
          waitUntilVisible: true
- extendedWaitUntil:
    visible:
      id: join-recovery-fixture-banner
    timeout: 60000
- scrollUntilVisible:
    element:
      id: join-form-submit
    direction: DOWN
- tapOn:
    id: join-form-submit
- extendedWaitUntil:
    visible:
      id: join-form-error
    timeout: 10000
- assertVisible:
    text: "Captain Free Fire in-game name is required."
- assertVisible:
    text: "Submit attempts: 0"
- assertNotVisible:
    id: join-recovery-confirmation
- assertNotVisible: "Registration confirmed"
