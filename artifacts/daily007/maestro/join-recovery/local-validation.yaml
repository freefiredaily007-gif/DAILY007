appId: host.exp.exponent
---
- openLink:
    link: ${EXPO_DEV_URL}/--/join-recovery-test
- tapOn:
    text: Continue
    optional: true
- extendedWaitUntil:
    visible:
      id: join-recovery-fixture-banner
    timeout: 60000
- scrollUntilVisible:
    element:
      id: join-form-submit
    direction: DOWN
- tapOn:
    id: join-form-submit
- extendedWaitUntil:
    visible:
      id: join-form-error
    timeout: 10000
- assertVisible:
    text: "Captain Free Fire in-game name is required."
- assertVisible:
    text: "Submit attempts: 0"
- assertNotVisible:
    id: join-recovery-confirmation
- assertNotVisible: "Registration confirmed"
