appId: host.exp.exponent
---
- openLink:
    link: ${EXPO_DEV_URL}/--/join-recovery-test
# Expo Go's bundle progress is not consistently exposed to Maestro's UI tree.
# Close the background Pixel Launcher ANR and Expo Go menu until the route is accessible.
- repeat:
    times: 12
    while:
      notVisible:
        id: join-recovery-fixture-banner
    commands:
      - runFlow:
          when:
            visible: "Pixel Launcher isn't responding"
          commands:
            - tapOn:
                id: android:id/aerr_close
      - tapOn:
          id: android:id/aerr_wait
          optional: true
          waitUntilVisible: true
      - tapOn:
          text: Continue
          optional: true
          waitUntilVisible: true
      - runFlow:
          when:
            visible: Open React Native dev menu
          commands:
            - pressKey: BACK
      - runFlow:
          when:
            visible: Continue
          commands:
            - pressKey: BACK
      - runFlow:
          when:
            visible: Reload
          commands:
            - pressKey: BACK
- extendedWaitUntil:
    visible:
      id: join-recovery-fixture-banner
    timeout: 60000
- tapOn:
    id: join-recovery-scenario-insufficient-balance
- scrollUntilVisible:
    element:
      id: join-form-submit
    direction: DOWN
    centerElement: true
- tapOn:
    id: join-form-submit
- extendedWaitUntil:
    visible:
      id: join-form-error
    timeout: 10000
- assertVisible:
    text: ".*Enter your Free Fire in-game name and UID to continue.*"
- assertVisible:
    text: "Submit attempts: 0"
- assertNotVisible:
    id: join-recovery-confirmation
- assertNotVisible: "Registration confirmed"
