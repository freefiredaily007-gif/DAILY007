appId: host.exp.exponent
---
- openLink:
    link: ${EXPO_DEV_URL}/--/join-recovery-test
# Expo Go's bundle progress is not consistently exposed to Maestro's UI tree.
# Retry startup prompts and close the native dev menu until the route is accessible.
- repeat:
    times: 12
    while:
      notVisible:
        id: join-recovery-fixture-banner
    commands:
      - tapOn:
          id: android:id/aerr_wait
          optional: true
      - tapOn:
          text: Continue
          optional: true
          waitUntilVisible: true
      - runFlow:
          when:
            visible: Continue
          commands:
            - pressKey: BACK
      - runFlow:
          when:
            visible: Reload
          commands:
            - pressKey: BACK
- extendedWaitUntil:
    visible:
      id: join-recovery-fixture-banner
    timeout: 60000
- tapOn:
    id: join-recovery-scenario-insufficient-balance
- tapOn:
    id: join-form-player-game-name
- inputText: "Native Test Player"
- scrollUntilVisible:
    element:
      id: join-form-player-game-uid
    direction: DOWN
- tapOn:
    id: join-form-player-game-uid
- inputText: "123456789"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: join-form-submit
    direction: DOWN
- tapOn:
    id: join-form-submit
- extendedWaitUntil:
    visible:
      id: join-form-error
    timeout: 10000
- assertVisible:
    text: "Insufficient wallet balance: this entry costs 75 coins."
- assertVisible:
    text: "Submit attempts: 1"
- scrollUntilVisible:
    element:
      id: join-form-player-game-name
    direction: UP
- assertVisible:
    id: join-form-player-game-name
    text: "Native Test Player"
- scrollUntilVisible:
    element:
      id: join-form-player-game-uid
    direction: DOWN
- assertVisible:
    id: join-form-player-game-uid
    text: "123456789"
- assertNotVisible:
    id: join-recovery-confirmation
- assertNotVisible: "Registration confirmed"
- tapOn:
    id: join-recovery-wallet-top-up
- assertVisible:
    id: join-recovery-wallet-status
- assertNotVisible:
    id: join-recovery-confirmation
- scrollUntilVisible:
    element:
      id: join-form-submit
    direction: DOWN
- tapOn:
    id: join-form-submit
- extendedWaitUntil:
    visible:
      id: join-recovery-pending-response
    timeout: 10000
- extendedWaitUntil:
    visible:
      text: "Submit attempts: 2"
    timeout: 10000
- scrollUntilVisible:
    element:
      id: join-form-player-game-name
    direction: UP
- assertVisible:
    id: join-form-player-game-name
    text: "Native Test Player"
- scrollUntilVisible:
    element:
      id: join-form-player-game-uid
    direction: DOWN
- assertVisible:
    id: join-form-player-game-uid
    text: "123456789"
- assertNotVisible:
    id: join-recovery-confirmation
- tapOn:
    id: join-recovery-complete-success
- extendedWaitUntil:
    visible:
      id: join-recovery-confirmation
    timeout: 10000
- assertVisible:
    text: "Registration confirmed after simulated wallet top-up."
- assertNotVisible:
    id: join-form-error
