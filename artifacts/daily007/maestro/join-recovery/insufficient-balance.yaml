appId: host.exp.exponent
---
- openLink:
    link: ${EXPO_DEV_URL}/--/join-recovery-test
- extendedWaitUntil:
    visible:
      id: join-recovery-fixture-banner
    timeout: 15000
- tapOn:
    id: join-recovery-scenario-insufficient-balance
- tapOn:
    id: join-form-captain-game-name
- inputText: "Native Test Captain"
- scrollUntilVisible:
    element:
      id: join-form-captain-game-uid
    direction: DOWN
- tapOn:
    id: join-form-captain-game-uid
- inputText: "123456789"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: join-form-submit
    direction: DOWN
- tapOn:
    id: join-form-submit
- extendedWaitUntil:
    visible:
      id: join-form-error
    timeout: 10000
- assertVisible:
    text: "Insufficient wallet balance: this entry costs 75 coins."
- assertVisible:
    text: "Submit attempts: 1"
- assertNotVisible:
    id: join-recovery-confirmation
- assertNotVisible: "Registration confirmed"
- scrollUntilVisible:
    element:
      id: join-form-captain-game-uid
    direction: DOWN
- tapOn:
    id: join-form-captain-game-uid
- inputText: "2"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: join-form-submit
    direction: DOWN
- tapOn:
    id: join-form-submit
- extendedWaitUntil:
    visible:
      text: "Submit attempts: 2"
    timeout: 10000
- assertVisible:
    id: join-form-error
- assertNotVisible:
    id: join-recovery-confirmation
- assertNotVisible: "Registration confirmed"
