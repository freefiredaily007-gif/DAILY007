appId: host.exp.exponent
---
- openLink:
    link: ${EXPO_DEV_URL}/--/leaderboard-native-text-scale-${LEADERBOARD_CYCLE}
# Expo Go's blue failure page is generic; open its error log before the
# fixture assertion so CI artifacts capture the underlying launch failure.
- runFlow:
    when:
      visible: "Something went wrong."
    commands:
      - tapOn:
          text: "View error log"
- repeat:
    times: 12
    while:
      notVisible:
        id: leaderboard-native-text-scale-fixture-banner
    commands:
      - runFlow:
          when:
            visible: "Pixel Launcher isn't responding"
          commands:
            - tapOn:
                id: android:id/aerr_close
      - tapOn:
          id: android:id/aerr_wait
          optional: true
          waitUntilVisible: true
      - tapOn:
          text: Continue
          optional: true
          waitUntilVisible: true
      - runFlow:
          when:
            visible: Open React Native dev menu
          commands:
            - pressKey: BACK
      - runFlow:
          when:
            visible: Continue
          commands:
            - pressKey: BACK
      - runFlow:
          when:
            visible: Reload
          commands:
            - pressKey: BACK
- extendedWaitUntil:
    visible:
      id: leaderboard-native-text-scale-fixture-banner
    timeout: 60000
- assertVisible:
    text: "Native leaderboard fixture | ${LEADERBOARD_CYCLE} | font scale ${LEADERBOARD_SCALE} | layout ${LEADERBOARD_LAYOUT}"

- scrollUntilVisible:
    element:
      id: leaderboard-podium-1
    direction: DOWN
- assertVisible:
    text: "Rank 1, ${LEADERBOARD_CHAMPION}, 19,269 coins"
- scrollUntilVisible:
    element:
      id: leaderboard-podium-2
    direction: DOWN
- assertVisible:
    text: "Rank 2, Tournament Competitor 2, 18,538 coins"
- scrollUntilVisible:
    element:
      id: leaderboard-podium-3
    direction: DOWN
- assertVisible:
    text: "Rank 3, Tournament Competitor 3, 17,807 coins"

- scrollUntilVisible:
    element:
      id: leaderboard-top20-toggle
    direction: DOWN
    centerElement: true
- swipe:
    start: 50%, 75%
    end: 50%, 30%
    duration: 450
- tapOn:
    id: leaderboard-top20-toggle
- assertVisible:
    text: "HIDE TOP 20 PLAYERS"
- scrollUntilVisible:
