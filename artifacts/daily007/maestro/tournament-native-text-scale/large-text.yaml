appId: host.exp.exponent
---
- openLink:
    link: ${EXPO_DEV_URL}/--/tournament-native-text-scale-test
- extendedWaitUntil:
    visible:
      id: tournament-text-scale-banner
    timeout: 15000
- assertVisible:
    text: "Tournament card fixture | font scale ${TOURNAMENT_TEXT_SCALE} | large"
- extendedWaitUntil:
    visible:
      text: "Tournament filters fit screen width at ${TOURNAMENT_TEXT_SCALE}x"
    timeout: 10000

- assertVisible:
    text: "Selected tournament mode: all"
- tapOn:
    id: tournament-mode-tab-battle_royale_kill_earn
- assertVisible:
    text: "Selected tournament mode: battle_royale_kill_earn"
- scrollUntilVisible:
    element:
      id: tournament-card-text-scale-kill-earn-name
    direction: DOWN
- assertVisible:
    text: "International Kill & Earn Championship With Extended Finals Schedule"
- scrollUntilVisible:
    element:
      id: tournament-card-text-scale-kill-earn-date
    direction: DOWN
- assertVisible:
    text: "28 OCT 2027"
- scrollUntilVisible:
    element:
      id: tournament-card-text-scale-kill-earn-metric-prize-pool
    direction: DOWN
- assertVisible:
    text: "PRIZE POOL"
- scrollUntilVisible:
    element:
      id: tournament-card-text-scale-kill-earn-metric-per-kill
    direction: DOWN
- assertVisible:
    text: "PER KILL"
- scrollUntilVisible:
    element:
      id: tournament-card-text-scale-kill-earn-metric-entry
    direction: DOWN
- assertVisible:
    text: "ENTRY"
- scrollUntilVisible:
    element:
      id: tournament-card-text-scale-kill-earn-progress-count
    direction: DOWN
- assertVisible:
    text: "16/48 JOINED"
- scrollUntilVisible:
    element:
      id: tournament-card-text-scale-kill-earn-progress-spots
    direction: DOWN
- assertVisible:
    text: "32 SPOTS LEFT"
- scrollUntilVisible:
    element:
      id: tournament-card-text-scale-kill-earn-join
    direction: DOWN
- assertVisible:
    text: "JOIN TOURNAMENT"
- tapOn:
    id: tournament-card-text-scale-kill-earn-join
- assertVisible:
    text: "Opened tournament card: text-scale-kill-earn"

- scrollUntilVisible:
