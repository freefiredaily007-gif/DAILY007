appId: host.exp.exponent
---
- scrollUntilVisible:
    element:
      id: profile-text-scale-name
    direction: UP
    visibilityPercentage: 100
    waitToSettleTimeoutMs: 500
    centerElement: true
    timeout: 30000
- scrollUntilVisible:
    element:
      id: continue-with-google
    direction: DOWN
    speed: 20
    visibilityPercentage: 50
    waitToSettleTimeoutMs: 500
    centerElement: true
    timeout: 30000
- extendedWaitUntil:
    visible:
      id: continue-with-google
    timeout: 20000
- tapOn:
    id: continue-with-google
- tapOn:
    id: continue-with-google
    optional: true
- extendedWaitUntil:
    visible: "Second exchange: succeeded online"
    timeout: 30000
- scrollUntilVisible:
    element:
      text: "APP INFO"
