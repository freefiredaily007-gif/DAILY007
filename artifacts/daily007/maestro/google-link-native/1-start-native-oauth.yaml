appId: host.exp.exponent
---
- openLink:
    link: ${EXPO_DEV_URL}/--/google-link-native-test
- extendedWaitUntil:
    visible:
      id: google-link-native-phase
    timeout: 30000
- assertVisible: "Native test: ready"
- assertVisible: "Daily007 account: native-google-link-player"
- tapOn: "PROFILE"
- scrollUntilVisible:
    element:
      id: profile-text-scale-name
    direction: UP
    centerElement: true
    timeout: 30000
- scrollUntilVisible:
    element:
      id: profile-google-connection-title
    direction: DOWN
    speed: 20
    visibilityPercentage: 50
    waitToSettleTimeoutMs: 500
    centerElement: false
    timeout: 30000
- extendedWaitUntil:
    visible: "CONNECT GOOGLE"
    timeout: 30000
- assertVisible: "CONNECT GOOGLE"
- assertVisible:
    id: continue-with-google
- assertNotVisible:
    id: profile-google-connected
- assertVisible: "Saved wallet: 42 coins"
- assertVisible: "Password bearer: password token preserved"
- tapOn:
    id: continue-with-google
- tapOn:
    id: continue-with-google
    optional: true
- tapOn:
    text: "Use without an account"
    optional: true
    waitUntilVisible: true
- extendedWaitUntil:
    visible: "Continue with test Google"
    timeout: 30000
